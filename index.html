<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки — языковой тренажёр</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1c2333; --muted:#6b7487;
  --accent:#4f6ef7; --accent-ink:#ffffff; --ok:#2e9e5b; --ok-bg:#e6f6ec;
  --bad:#d64550; --bad-bg:#fdeaea; --line:#e3e7ef; --chip:#eef1f8;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
  --radius:14px;
  --font-mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151c; --card:#1b202b; --ink:#e8ecf5; --muted:#9aa3b5;
    --accent:#6c86ff; --accent-ink:#0e1420; --ok:#4fc07f; --ok-bg:#1d3327; --bad:#e36672; --bad-bg:#3a2126;
    --line:#2a3140; --chip:#232a37; --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{font-size:16px}  /* база rem: настройка «Размер шрифта» меняет её через JS, и масштабируется весь интерфейс */
body{background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:860px;margin:0 auto;padding:16px 14px 70px}
h1{font-size:1.35rem;margin:.2rem 0 1rem}
h2{font-size:1.12rem;margin:1.6rem 0 .6rem}
h3{font-size:1rem;margin:1.2rem 0 .4rem}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.err{color:var(--bad);font-size:.85rem}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang-switch button{border:0;background:transparent;color:var(--muted);padding:.35rem .65rem;cursor:pointer;font-size:.85rem}
.lang-switch button.on{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.55rem .9rem;font-size:.95rem;cursor:pointer;user-select:none;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:.32rem .65rem;font-size:.85rem;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.deck{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.deck .name{font-weight:600;font-size:1.02rem;word-break:break-word}
.badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.meta{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:16px}
.panel h3{margin-top:0}
input[type=text],input[type=url],input[type=number],select.sel{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem;font-family:inherit}
select.sel{appearance:none;-webkit-appearance:none}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.fld{display:block;font-size:.85rem;color:var(--muted);margin:.9rem 0 .35rem}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:.28rem .75rem;font-size:.85rem;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
select.sel.sel-inline{width:auto;min-width:64px;padding:.28rem .45rem;font-size:.85rem;border-radius:8px}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stage{position:relative}
.tapholder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.3rem;line-height:1.45;word-break:break-word}
.tapholder.small{font-size:1.05rem;cursor:default;align-items:stretch;text-align:left}
.side-label{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem}
.flip-hint{color:var(--muted);font-size:.8rem;margin-top:14px}
.card-img{max-width:100%;height:auto;max-height:170px;border-radius:10px;margin:.5rem 0}
.divider{height:1px;background:var(--line);margin:16px 0;width:100%}
.grade{display:flex;gap:10px;margin-top:16px}
.grade .btn{flex:1;justify-content:center;padding:.85rem;font-size:1.02rem;border-radius:12px}
.g-ok{color:var(--ok);border-color:var(--ok)}
.g-bad{color:var(--bad);border-color:var(--bad)}
.answer-box{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:.75rem .9rem;margin-top:12px;font-size:1.12rem;word-break:break-word}
.diff-ok{color:var(--ok)}
.diff-no{color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px;text-underline-offset:4px}
.typed-echo{color:var(--muted);font-size:.88rem;margin-top:.5rem;word-break:break-word}
.alts{color:var(--muted);font-size:.85rem;margin-top:.5rem}
.hintline{background:var(--chip);border-radius:10px;padding:.55rem .85rem;margin-top:12px;font-size:1.1rem;letter-spacing:.14em;word-break:break-all}
.hinttext{color:var(--muted);font-size:.9rem;margin-top:10px;font-style:italic}
.keys{color:var(--muted);font-size:.75rem;margin-top:22px;text-align:center}
@media(max-width:639px){.keys{display:none}}
.audio-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.instr{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.instr{grid-template-columns:225px 1fr;align-items:start}}
.instr nav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-wrap:wrap;gap:4px}
@media(min-width:760px){.instr nav{flex-direction:column;position:sticky;top:12px;flex-wrap:nowrap}}
.instr nav a{padding:.4rem .6rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9rem;cursor:pointer;display:block}
.instr nav a:hover{background:var(--chip)}
.instr .content{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.instr .content section{border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:1.4rem}
.instr .content section:last-child{border-bottom:0;margin-bottom:0}
.codebox{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:.6rem 0 1rem}
.codebox pre{margin:0;font:.78rem/1.55 var(--font-mono);white-space:pre}
.copy{position:absolute;top:6px;right:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6rem 0}
th,td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--chip)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:99;max-width:90vw;box-shadow:var(--shadow)}
</style>
</head>

<script>

/* =====================================================================

/* ============================ i18n ============================ */

let LANG = 'ru';
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k; }

/* ============================ utils ============================ */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fnv(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
function nowIso(){ return new Date().toISOString(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let toastTimer=null;
function toast(msg, ms){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>d.remove(), ms||2800);
}
function copyText(text){
  const done=()=>toast(t('copied'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast(t('copied')); }
    ta.remove();
  }
}

/* ---- PARSER BEGIN (pure functions, no DOM) ---- */
function normalizeText(s){
  return String(s||'').toLowerCase()
    .replace(/ё/g,'е')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[«»"'„“”()\[\]{}¿?¡!.,;:—–\-…]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function normalizeWord(s){ return normalizeText(s); }
function extractFrontmatter(text){
  const lines=text.split('\n');
  if(!lines.length || lines[0].trim()!=='---') return null;
  let end=-1;
  for(let i=1;i<lines.length;i++){ if(lines[i].trim()==='---'){ end=i; break; } }
  if(end<0) return null;
  const meta={};
  for(const l of lines.slice(1,end)){
    const m=l.match(/^([A-Za-z_][\w-]*)\s*:\s*(.*)$/);
    if(m) meta[m[1].toLowerCase()]=m[2].trim().replace(/^["']|["']$/g,'');
  }
  return { meta, body: lines.slice(end+1).join('\n') };
}
const FIELD_KEYS=['front','back','prompt','answer','alt1','alt2','alt','hint','audio1','audio2','audio','tags','id','direction','reverse'];
const FIELD_RE=new RegExp('^\\s*('+FIELD_KEYS.join('|')+')\\s*:\\s*(.*)$','i');
function splitPipes(joined){
  for(let i=0;i<joined.length-2;i++){
    if(joined[i]===' ' && joined[i+1]==='|' && joined[i+2]===' ' && (i===0||joined[i-1]!=='\\')){
      return [joined.slice(0,i), joined.slice(i+3)];
    }
  }
  return null;
}
function unesc(s){ return s.replace(/\\\|/g,'|'); }
// однострочная запись: все вхождения « | » (с учётом экранирования \|) → массив полей
function splitAllPipes(s){
  const parts=[]; let rest=String(s||'');
  for(;;){
    const sp=splitPipes(rest);
    if(!sp){ parts.push(rest); break; }
    parts.push(sp[0]); rest=sp[1];
  }
  return parts.map(x=>x.trim());
}
// «;» в однострочном поле = варианты; первое значение — каноничное
function splitVariants(v){
  const ps=String(v||'').split(';').map(s=>s.trim()).filter(Boolean);
  return { main: ps[0]||'', alts: ps.slice(1) };
}
function looksLikeRecord(line){
  if(/\t/.test(line)) return true;
  return splitAllPipes(line).length>=2;
}
// однострочная запись → карточка/задание; parts: [сторона1, сторона2, hint?, tags?]
function recordFromParts(parts, section, warnings, src){
  const clip=s=>String(s).slice(0,40)+(s.length>40?'…':'');
  if(parts.length<2 || !parts[0] || !parts[1]){
    if(section==='tasks') warnings.push('Задание без поля answer пропущено: «'+clip(src)+'»');
    else warnings.push('Строка без « | » пропущена: «'+clip(src)+'»');
    return null;
  }
  const v1=splitVariants(unesc(parts[0])), v2=splitVariants(unesc(parts[1]));
  // без заголовка секции: 2 поля — флеш-карта, 3+ — задание; секция задаёт тип жёстко
  const type = section==='tasks' ? 'task' : (section==='cards' ? 'card' : (parts.length>=3 ? 'task' : 'card'));
  const c={ type, audio:[], tags: parts[3]?parseTags([parts[3]]):[], alts:v2.alts };
  if(v1.alts.length) c.alt1=v1.alts;
  if(parts[2]) c.hint=parts[2];
  if(type==='card'){ c.front=v1.main; c.back=v2.main; }
  else {
    c.prompt=v1.main; c.answer=v2.main;
    if(!c.answer.trim()){ warnings.push('Задание с пустым answer пропущено: «'+clip(src)+'»'); return null; }

}
function parseTags(arr){
  return (arr||[]).join(',').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
}
function fieldValue(f){
  let v=f.val;
  const blockMarker=(v===''||v==='|'||v==='|-');
  if(blockMarker){
    const ls=f.lines;
    let min=-1;
    for(const l of ls){ if(l.trim()!==''){ const ind=l.match(/^\s*/)[0].length; if(min<0||ind<min) min=ind; } }
    if(min<0) min=0;
    const out=ls.map(l=> min>0 && /^\s/.test(l) ? l.slice(min) : l).join('\n');
    return out.replace(/^\n+/,'').replace(/\s+$/,'');
  }
  if(f.lines.length && f.lines.join('').trim()){
    return (v+'\n'+f.lines.join('\n')).trim();
  }
  return v.trim();
}
// поля, открывающие новую блочную запись; остальные ключи — необязательные
const RECORD_KEYS={front:1, back:1, prompt:1, answer:1};
// необязательное поле, дописанное под уже разобранной записью, прикрепляется к ней
function applyModifier(c, key, v){
  v=String(v||'').trim();
  switch(key){
    case 'audio': case 'audio1': case 'audio2':
      if(v) (c[key]=c[key]||[]).push(v);
      break;
    case 'hint':
      if(v) c.hint=v;
      break;
    case 'tags':
      if(v) c.tags=c.tags.concat(parseTags([v]));
      break;
    case 'alt': case 'alt1': case 'alt2': {
      const ps=v.split(';').map(s=>s.trim()).filter(Boolean);
      const kk=key==='alt1'?'alt1':'alts';
      if(ps.length){ (c[kk]=c[kk]||[]).push(...ps); finalizeCard(c); }
      break;
    }
    case 'id':
      if(v) c.id=v;
      break;
    case 'direction': {
      const d=v.toLowerCase(); c.direction=['l2l1','l1l2','both'].includes(d)?d:'both';
      break;
    }
    case 'reverse':
      c.reverse=(v.toLowerCase()==='true'||v.toLowerCase()==='yes');
      break;
  }
}
function parseBlockLines(rawLines, section, warnings){
  const lines=rawLines.slice();
  while(lines.length && !lines[0].trim()) lines.shift();
  while(lines.length && !lines[lines.length-1].trim()) lines.pop();
  if(!lines.length) return [];
  const out=[]; const fields=[]; let hasField=false;
  // завершить накопленный блочный разбор: собрать карточку из полей
  const flush=()=>{
    if(!fields.length) return;
    const mods=fields.filter(f=>f.mod);
    const norms=fields.filter(f=>!f.mod);
    for(const f of mods) applyModifier(f.mod, f.key, fieldValue(f));
    const reset=()=>{ fields.length=0; hasField=false; };
    if(!norms.length){ reset(); return; }
    const obj={};
    for(const f of norms){ const v=fieldValue(f); (obj[f.key]=obj[f.key]||[]).push(v); }
    const g=k=>obj[k]&&obj[k][0];
    const c={ audio:(obj.audio||[]).filter(Boolean),
              audio1:(obj.audio1||[]).filter(Boolean),
              audio2:(obj.audio2||[]).filter(Boolean),
              alts:(obj.alt||[]).concat(obj.alt2||[]).flatMap(a=>String(a).split(';')).map(s=>s.trim()).filter(Boolean),
              alt1:(obj.alt1||[]).flatMap(a=>String(a).split(';')).map(s=>s.trim()).filter(Boolean),
              tags:parseTags(obj.tags) };
    if(obj.hint) c.hint=g('hint');
    if(obj.id) c.id=String(g('id')).trim();
    if(obj.direction){ const d=String(g('direction')).trim().toLowerCase(); c.direction=['l2l1','l1l2','both'].includes(d)?d:'both'; }
    if(obj.reverse){ const r=String(g('reverse')).trim().toLowerCase(); c.reverse=(r==='true'||r==='yes'); }
    if(g('answer')!==undefined){
      c.type='task'; c.prompt=g('prompt')||''; c.answer=g('answer')||'';
      if(!c.answer.trim()){ warnings.push('Задание с пустым answer пропущено'); reset(); return; }
      if(!c.prompt.trim() && !c.audio.length && !c.audio1.length && !c.audio2.length) warnings.push('Задание без prompt и без аудио пропущено');
    } else if(g('front')!==undefined){
      c.type='card'; c.front=g('front')||''; c.back=g('back')||'';
    } else {
      warnings.push('Блок без front/prompt пропущен'); reset(); return;
    }
    out.push(finalizeCard(c)); reset();
  };
  for(const line of lines){
    const m=line.match(FIELD_RE);
    if(m){
      const key=m[1].toLowerCase();
      // необязательное поле без открытого блока продолжает последнюю запись
      // (однострочник выше или только что закрытый блок); поле записи — новый блок
      let modTarget=null;
      if(!RECORD_KEYS[key]){
        if(!fields.length && out.length) modTarget=out[out.length-1];
        else if(fields.length && fields[0].mod) modTarget=fields[0].mod;
      }
      hasField=true;
      fields.push({key, val:m[2], lines:[], mod:modTarget});
      continue;
    }
    const s=line.trim();
    if(!s) continue;
    // однострочная запись начинается с края строки и содержит « | » или Tab;
    // такие строки завершают накопленный блок и разбираются сами по себе
    if(!/^\s/.test(line) && looksLikeRecord(line)){
      flush();
      const parts=/\t/.test(line) ? line.split('\t').map(x=>x.trim()) : splitAllPipes(line);
      const rec=recordFromParts(parts, section, warnings, s);
      if(rec) out.push(rec);
      continue;
    }
    if(hasField && fields.length){ fields[fields.length-1].lines.push(line); continue; }
    warnings.push('Строки вне полей пропущены: «'+s.slice(0,40)+(s.length>40?'…':'')+'»');
  }
  flush();
  return out;
}
function finalizeCard(c){
  const base = c.type==='card' ? ('card|'+c.front) : ('task|'+c.prompt+'|'+c.answer);
  if(!c.id) c.id=fnv(base);
  if(c.type==='card'){
    if(c.alts) c.alts=c.alts.filter(a=>normalizeText(a)!==normalizeText(c.back));
    if(c.alt1) c.alt1=c.alt1.filter(a=>normalizeText(a)!==normalizeText(c.front));
  } else {
    if(c.alts) c.alts=c.alts.filter(a=>normalizeText(a)!==normalizeText(c.answer));
    if(c.alt1) c.alt1=c.alt1.filter(a=>normalizeText(a)!==normalizeText(c.prompt));
  }
  if(c.alt1 && !c.alt1.length) delete c.alt1;
  if(c.alts && !c.alts.length) delete c.alts;
  return c;
}
function makeDeck(meta, cards, warnings, filename){
  const base=(filename||'Колода').replace(/\.[^.]+$/,'');
  return {
    title: String(meta.title||base).trim()||'Колода',
    lang: (meta.lang||'').toLowerCase(),
    base: (meta.base||'').toLowerCase(),
    reverse: /^(true|yes|да|1)$/i.test(meta.reverse||''),
    description: meta.description||'',
    cards, warnings

}
function parseMd(text, filename){
  const warnings=[];
  const fm=extractFrontmatter(text);
  let body=text, meta={};
  if(fm){ meta=fm.meta; body=fm.body; }
  const blocks=[]; let cur=[]; let section=null; let prevBlank=false;
  for(const line of body.split('\n')){
    const h=line.match(/^\s*#\s+(.+?)\s*$/);
    if(h){
      if(cur.length){ blocks.push({section, lines:cur}); cur=[]; }
      const ht=h[1].toLowerCase();
      if(ht==='карточки'||ht==='cards') section='cards';
      else if(ht==='задания'||ht==='tasks') section='tasks';
      continue;
    }
    if(/^\s*-{3,}\s*$/.test(line)){ blocks.push({section, lines:cur}); cur=[]; prevBlank=true; continue; }
    // пустая строка + новая строка front:/prompt: = новая карточка (без обязательного ---)
    if(prevBlank && cur.length && /^\s*(front|prompt)\s*:/i.test(line)){
      blocks.push({section, lines:cur}); cur=[];
    }
    cur.push(line);
    prevBlank=!line.trim();
  }
  if(cur.length) blocks.push({section, lines:cur});
  const cards=[];
  for(const b of blocks){
    const res=parseBlockLines(b.lines, b.section, warnings);
    const list=Array.isArray(res)?res:(res?[res]:[]);
    for(const c of list) cards.push(finalizeCard(c));
  }
  return makeDeck(meta, cards, warnings, filename);
}
function parseTsv(text, filename){
  const warnings=[]; const cards=[];
  for(const line of text.split('\n')){
    if(!line.trim() || /^\s*#/.test(line)) continue;
    const cols=line.split('\t').map(c=>c.trim());
    const c1=splitVariants(cols[0]), c2=splitVariants(cols[1]);
    if(cols.length>=3){
      cards.push(finalizeCard({ type:'task', prompt:c1.main, answer:c2.main, alt1:c1.alts, alts:c2.alts, audio:[], tags:parseTags([cols[2]]) }));
    } else if(cols.length>=2){
      cards.push(finalizeCard({ type:'card', front:c1.main, back:c2.main, alt1:c1.alts, alts:c2.alts, audio:[], tags:[] }));
    } else {
      warnings.push('Строка без Tab-разделителя пропущена: «'+line.trim().slice(0,40)+'…»');
    }
  }
  return makeDeck({}, cards, warnings, filename);
}
function parseDeck(text, filename){
  text=String(text||'').replace(/\r\n?/g,'\n');
  if(/\.txt$/i.test(filename||'')) return parseTsv(text, filename);
  return parseMd(text, filename);
}
function diffTokens(answer, typed){
  const a=String(answer||'').split(/\s+/).filter(Boolean);
  const b=String(typed||'').split(/\s+/).filter(Boolean);
  const n=a.length, m=b.length;
  const eq=(x,y)=>normalizeWord(x)===normalizeWord(y);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=eq(a[i],b[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const res=[]; let i=0,j=0;
  while(i<n && j<m){
    if(eq(a[i],b[j])){ res.push({t:a[i],ok:true}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ res.push({t:a[i],ok:false}); i++; }
    else { j++; }
  }
  while(i<n){ res.push({t:a[i],ok:false}); i++; }
  return res;
}
function isExact(answer, typed, alts){
  const nt=normalizeText(typed);
  if(!nt) return false;
  return normalizeText(answer)===nt || (alts||[]).some(x=>normalizeText(x)===nt);
}
const VISIBLE_CH=/[\s¿?¡!.,;:«»"'„“”(){}\[\]\-–—…]/;
function buildMask(target, revealed){
  return [...String(target||'')].map((ch,i)=> (VISIBLE_CH.test(ch)||revealed.has(i)) ? ch : '•').join('');
}
function nextRevealIndex(target, revealed){
  const idx=[];
  [...String(target||'')].forEach((ch,i)=>{ if(!VISIBLE_CH.test(ch) && !revealed.has(i)) idx.push(i); });
  if(!idx.length) return null;
  return idx[Math.floor(Math.random()*idx.length)];
}

const LS={ settings:'lt.settings', decks:'lt.decks', progress:'lt.progress' };

/* ============================ decks ============================ */
const deckCache={};
function getDeck(meta){
  const ck=meta.id+'|'+fnv(meta.text||'');
  if(deckCache[ck]) return deckCache[ck];
  const fname=meta.url||meta.name||'x.md';
  const isTxt=/\.txt$/i.test(fname);
  const d=parseDeck(meta.text||'', isTxt?'x.txt':fname);
  d.metaId=meta.id;

}
function deckIdForLocal(title){ return 'local:'+String(title||'').toLowerCase(); }
const localAssets={}; // deckId -> {relPath: blobUrl}
function resolverFor(metaId){
  const meta=deckMetas.find(m=>m.id===metaId);
  return src=>{
    if(/^(https?:|data:|blob:)/i.test(src)) return src;
    if(meta && meta.kind==='local'){
      const map=localAssets[meta.id]||{};
      const clean=src.replace(/^\.\//,'');
      if(map[clean]) return map[clean];
      if(map[clean.split('/').pop()]) return map[clean.split('/').pop()];
      return src;
    }
    if(meta && meta.url){
      try{ return new URL(src, meta.url).href; }catch(e){ return src; }
    }
    return src;
  };
}
function upsertDeck(meta){
  const i=deckMetas.findIndex(d=>d.id===meta.id);
  if(i>=0) deckMetas[i]=meta; else deckMetas.push(meta);
  saveDecks();
}
function addDeckFromText(text, name, kind, url){
  const deck=parseDeck(text, url||name);
  if(!deck.cards.length){ toast(t('parseEmpty')); return null; }
  const id = kind==='url' ? 'url:'+url : deckIdForLocal(deck.title);
  const meta={ id, kind, name:deck.title, url:url||'', text, savedAt:nowIso() };
  delete meta.error;
  upsertDeck(meta);
  return meta;
}
function demoDeckMeta(){

}
function seedBuiltins(){
  let changed=false;
  // миграция: старая испанская демо-колода заменяется английской
  const legacy=deckMetas.findIndex(d=>d.id==='builtin:demo-es');
  if(legacy>=0){ deckMetas.splice(legacy,1); changed=true; }
  const demoId='builtin:demo-en';
  const dm=deckMetas.find(d=>d.id===demoId);
  if(!dm){
    deckMetas.unshift(demoDeckMeta());
    changed=true;
  } else if(dm.text!==DEMO_DECK){
    // встроенная демо-колода всегда синхронизируется с текущей версией сайта; прогресс сохраняется по id карточек
    dm.text=DEMO_DECK;
    dm.name=demoDeckMeta().name;
    changed=true;
  }
  for(const r of RECOMMENDED_DECKS){
    if(!r.url) continue;
    const id='builtin:'+fnv(r.url);
    if(!deckMetas.some(d=>d.id===id)){
      deckMetas.push({ id, kind:'builtin', name:r.name||r.url, url:r.url, text:'', savedAt:'' });
      changed=true;

async function fetchDeckText(id, silent){
  const m=deckMetas.find(d=>d.id===id);
  if(!m || !m.url) return;
  try{
    const res=await fetch(m.url, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    m.text=await res.text();
    m.savedAt=nowIso();
    delete m.error;
    const d=parseDeck(m.text, m.url);
    if(d.cards.length) m.name=d.title;
    saveDecks();
    if(!silent){ toast(t('updated')); rerender(); }
    else rerender();
  }catch(e){
    m.error=e.message; saveDecks();
    if(!silent){ toast(t('fetchFail')+': '+e.message); rerender(); }
    else rerender();
  }
}

// audio/audio1 — озвучка стороны 1 (front/prompt), audio2 — стороны 2 (back/answer)
function audio1Of(c){ return ((c.audio1||[]).concat(c.audio||[])).filter(Boolean); }

/* ============================ session ============================ */
let S=null;          // текущая сессия
let pendingSetup=null;
function startSession(config){
  const decks=config.deckIds
    .map(id=>{ const m=deckMetas.find(x=>x.id===id); return m?getDeck(m):null; })
    .filter(Boolean);
  const exs=[];
  for(const d of decks){
    for(const c of d.cards){
      // режим сессии фильтрует тип упражнений: в «Заданиях» карточек быть не должно
      if(config.mode==='cards' && c.type!=='card') continue;
      if(config.mode==='tasks' && c.type!=='task') continue;
      if(config.tags.length && !c.tags.some(tg=>config.tags.includes(tg))) continue;
      let dirs;
      if(c.type==='card'){
        const rev=(c.reverse!==undefined)?c.reverse:d.reverse;
        dirs=rev?['l2l1','l1l2']:['l2l1'];
      } else {
        const dir=c.direction||'both';
        dirs=dir==='both'?['l1l2','l2l1']:[dir];
      }
      for(const dir of dirs){
        if(config.direction!=='mixed' && config.direction!==dir) continue;
        if(config.onlyMistakes){
          const r=progress[progKey(d.metaId,c.id)];
          if(!r || !r.m) continue;
        }
        exs.push({deck:d, card:c, dir});
      }
    }
  }
  if(!exs.length){ toast(t('noCards')); return; }
  shuffle(exs);
  const list=config.size ? exs.slice(0, config.size) : exs;
  S={ exs:list, i:0, flipped:false, revealed:false, typed:'', showHint:false,
      revealedLetters:new Set(), hintPresses:0, hintsTotal:0,
      ok:0, bad:0, done:false, config };
  playFaceAudio(cur(), initialFaceSide(cur()));
  if(location.hash==='#/session') rerender(); else location.hash='#/session';
}
function cur(){
  const ex=S.exs[S.i];

}
function sides(ex){

  }
  if(S.revealed) return;
  const b=sides(ex).b;
  const idx=nextRevealIndex(b, S.revealedLetters);
  if(idx==null){ toast(t('hintAllShown')); return; }
  S.revealedLetters.add(idx);
  S.hintPresses++; S.hintsTotal++;
  rerender();
}

function rich(text, ex){
  const res=resolverFor(ex.deck.metaId);
  let s=esc(text);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,alt,src)=>`<img class="card-img" src="${esc(res(src.trim()))}" alt="${esc(alt)}" loading="lazy">`);
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\n/g,'<br>');
  return s;
}
function audioRowHtml(ex, side){
  const list=audioListFor(ex, side||'1');
  if(!list.length) return '';
  return `<div class="audio-row">${list.map((u,i)=>`<button class="btn btn-sm" data-act="play" data-arg="${side||'1'}:${i}" title="${esc(u)}">🔊 ${esc(t('audio'))}${list.length>1?' '+(i+1):''}</button>`).join('')}</div>`;
}

  const opts=[[0.85,'85%'],[1,'100%'],[1.15,'115%'],[1.3,'130%'],[1.5,'150%']];

function gradeRowHtml(){
  return `<div class="grade">

    <button class="btn g-bad" data-act="grade" data-arg="bad">✕ ${esc(t('missed'))} <span class="muted">(2)</span></button>
  </div>`;
}
function cardStageHtml(ex, a, b){
  const flipped=S.flipped;
  // варианты принадлежат своей стороне: сторона 1 → alt1, сторона 2 → alts
  const face1=(ex.dir==='l2l1') ? !flipped : flipped;
  const variants=((face1?ex.card.alt1:ex.card.alts)||[]);
  const hintBtn=(!flipped && ex.card.hint)
    ? `<div class="row" style="margin-top:10px"><button class="btn btn-sm" data-act="hint">${esc(t('hint'))}</button></div>`:'';
  const hintLine=(S.showHint && ex.card.hint)
    ? `<div class="hinttext">${esc(t('hintField'))} ${esc(ex.card.hint)}</div>`:'';
  return `<div class="stage">
    <div class="tapholder" data-act="flip-card">
      <div class="side-label">${flipped?esc(t('sideB')):esc(t('sideA'))}</div>
      <div>${rich(flipped?b:a, ex)}</div>
      ${variants.length?`<div class="alts">${esc(t('variants'))} ${esc(variants.join('; '))}</div>`:''}
      ${!flipped?`<div class="flip-hint">${esc(t('tapToFlip'))}</div>`:''}
    </div>
    ${audioRowHtml(ex, currentFaceSide(ex))}
    ${hintBtn}${hintLine}
    ${flipped?gradeRowHtml():''}
  </div>`;
}
function taskStageHtml(ex, a, b){
  const revealed=S.revealed;
  let after='';
  if(revealed){
    // варианты вводимой стороны: ru→en (l1l2) — alt2 (alts), en→ru (l2l1) — alt1
    const alts=((ex.dir==='l1l2'?ex.card.alts:ex.card.alt1)||[]);
    const exact=isExact(b, S.typed, alts);
    const diff=diffTokens(b, S.typed).map(x=>`<span class="${x.ok?'diff-ok':'diff-no'}">${esc(x.t)}</span>`).join(' ');
    after=`<div class="answer-box">
        <div class="side-label" style="margin-bottom:.3rem">${esc(t('answer'))}</div>${diff}
        ${alts.length?`<div class="alts">${esc(t('alsoCorrect'))} ${esc(alts.join('; '))}</div>`:''}
        ${exact?`<div class="alts" style="color:var(--ok)">✓ ${esc(t('exact'))}</div>`:''}
      </div>
      <div class="typed-echo">${esc(t('yourAnswer'))} ${esc(S.typed||'—')}</div>
      ${gradeRowHtml()}`;
  }
  const maskLine=(!revealed && S.revealedLetters.size)
    ? `<div class="hintline">${esc(buildMask(b, S.revealedLetters))}</div>`:'';
  const hintText=(!revealed && ex.card.hint)
    ? `<div class="hinttext">${esc(t('hintField'))} ${esc(ex.card.hint)}</div>`:'';
  return `<div class="stage">
    <div class="tapholder small"><div class="side-label">${esc(t('prompt'))}</div><div>${rich(a, ex)}</div></div>
    ${audioRowHtml(ex, initialFaceSide(ex))}
    ${!revealed?`
      <div style="margin-top:14px"><input type="text" id="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(t('typeHere'))}" value="${esc(S.typed||'')}"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-primary" data-act="reveal">${esc(t('showAnswer'))}</button>
        <button class="btn" data-act="hint">${esc(t('hint'))}</button>
        <button class="btn" data-act="flip-dir" title="${esc(t('flipDir'))}">⇄</button>
      </div>
      ${maskLine}${hintText}
    `:`<div class="row" style="margin-top:10px"><button class="btn btn-sm" data-act="flip-dir">⇄ ${esc(t('flipDir'))}</button></div>`}
    ${after}
    ${revealed?audioRowHtml(ex, currentFaceSide(ex)):''}
  </div>`;
}

}

  {id:'audio', title:'Аудио', html:`
    <p><b>audio</b> (полное имя <b>audio1</b>) — озвучка стороны 1: фронт карточки или prompt задания. <b>audio2</b> — озвучка стороны 2: оборот карточки или ответ. При показе стороны звук проигрывается <b>один раз</b> автоматически; повторить — клавиша <b>P</b> или кнопка 🔊 под карточкой. Несколько полей audio — плейлист, кнопки идут по порядку.</p>
    <p>Аудио пишется блоком или строкой-модификатором под однострочной записью — прикрепится к ближайшей записи выше:</p>

    <p>Задание-аудирование: блок начинается с audio, prompt объясняет, что делать:</p>

    <h3>Как сделать свои аудио</h3>
    <p><b>edge-tts</b> — рекомендуемый способ: бесплатно, нейроголоса Microsoft, десятки языков. Установите Python, затем в терминале:</p>
    ${codebox(['pip install edge-tts','','edge-tts --voice en-US-AriaNeural --text "Good morning, how are you?" --write-media audio/good-morning.mp3',''].join('\n'))}

    <p>Полный список голосов: команда <b>edge-tts --list-voices</b>. Альтернативы: <b>gTTS</b> (простые голоса Google, короткий Python-скрипт), <b>Piper</b> (локальный синтез без интернета), <b>Forvo</b> (живые записи носителей для отдельных слов), платные сервисы максимального качества (Azure TTS, ElevenLabs, OpenAI TTS) и обычная запись голоса на телефоне. Файлы называйте латиницей без пробелов и храните в папке audio/ рядом с колодой.</p>`},
  {id:'loading', title:'Загрузка на сайт', html:`
    <p><b>Рекомендованные</b> — колоды, вшитые в сайт автором. <b>Ссылка</b> — raw-адрес файла на GitHub: сайт скачивает его и запоминает в браузере, дальше работает даже оффлайн; кнопка «Обновить» подтягивает правки. <b>Файлы с устройства</b> — md/txt плюс картинки и аудио рядом; кнопка «Выбрать папку» берёт сразу целую папку: сайт сам найдёт в ней колоды и свяжет медиа по относительным путям. Текст колоды сохраняется в браузере (localStorage), медиа действует до перезагрузки страницы.</p>

  {id:'progress', title:'Прогресс', html:`

  {id:'keys', title:'Горячие клавиши', html:`

    <p><b>Прогресс карточки сбросился после правки её текста.</b> Прогресс привязан к тексту — добавьте карточке поле id и меняйте текст свободно.</p>

  ];

function instrSectionsEn(){
  return [
  {id:'start', title:'Quick start', html:`
    <p>Three steps: create a deck text file → upload it (the "Choose files" button) or add a GitHub link → press "Train". Here is a full template you can copy and edit:</p>
    ${codebox(DEMO_DECK)}
    <p>Save files in UTF-8 as <b>.md</b> (full syntax) or <b>.txt</b> (table form, see below).</p>`},
  {id:'format', title:'Deck format', html:`
    <h3>Deck header</h3>
    <p>An optional YAML block at the top sets the title and languages:</p>
    ${codebox(['---','title: English A1 — Lesson 1','lang: en        # target language','base: ru        # translation language','reverse: true   # show cards in both directions','---',''].join('\n'))}
    <h3>Sections: # Cards and # Tasks</h3>
    <p>The heading <b># Карточки</b> (cards) starts the flashcard section, <b># Задания</b> (tasks) — the typing-task section. Lines of <b>---</b> and blank lines are optional visual separators; ordinary headings do not affect parsing. Without section headings the legacy syntax applies: a two-field line is a flashcard, three or more fields make a task.</p>
    <h3>One-line records</h3>
    <p>A record is one line with fields separated by <b> | </b>: side 1, side 2, then optional hint and tags. A semicolon inside the first two fields lists <b>alternatives</b>: the first value is the main text, the rest are also accepted. Escape a literal bar as <code>\\|</code>.</p>
    ${codebox(['# Карточки','hello | привет','good morning | доброе утро; добрый день','See you tomorrow! | До завтра! | said when parting | greetings','','# Задания','Привет, как дела? | Hello! How are you?; Hi! How are you? | informal greeting | greetings',''].join('\n'))}
    <p>Alternatives belong to their side: typing side 2 accepts its text and alternatives; press ⇄ to type side 1 — its text and alternatives are accepted. On flashcards alternatives are shown as "Variants: …", in tasks as "Also correct: …".</p>
    <h3>Block records</h3>
    <p>Long phrases, images and audio use the block form. <b>alt1</b> — alternatives of side 1, <b>alt2</b> — alternatives of side 2; the older <b>alt</b> still works as alt2. Inside block prompt/answer a semicolon is plain text (never split): if your text contains ";" or " | ", write it as a block.</p>
    ${codebox(['prompt: Меня зовут Ана.','alt1: Моё имя — Ана','answer: My name is Ana','alt2: I am Ana','tags: greetings','','prompt: |','  Один кофе, пожалуйста.','answer: |','  A coffee, please','alt: One coffee, please','tags: cafe',''].join('\n'))}
    <h3>Fields</h3>
    <div class="tablewrap"><table>
      <tr><th>Field</th><th>Applies to</th><th>Meaning</th></tr>
      <tr><td>front / back</td><td>card</td><td>side A and side B</td></tr>
      <tr><td>prompt / answer</td><td>task</td><td>shown prompt and expected answer</td></tr>
      <tr><td>alt1</td><td>both</td><td>side-1 alternatives (accepted when typing side 1, after ⇄)</td></tr>
      <tr><td>alt2</td><td>both</td><td>side-2 alternatives (accepted when typing side 2)</td></tr>
      <tr><td>alt</td><td>task</td><td>legacy alias for alt2</td></tr>
      <tr><td>hint</td><td>both</td><td>hint text</td></tr>
      <tr><td>audio / audio1</td><td>both</td><td>side-1 audio (front/prompt); path or URL (mp3/ogg/m4a/wav); repeat for a playlist</td></tr>
      <tr><td>audio2</td><td>both</td><td>side-2 audio (back/answer)</td></tr>
      <tr><td>tags</td><td>both</td><td>comma-separated tags for session filters</td></tr>
      <tr><td>id</td><td>both</td><td>stable id: keeps progress when text is edited</td></tr>
      <tr><td>reverse</td><td>card</td><td>true — train both directions</td></tr>
      <tr><td>direction</td><td>task</td><td>l1l2 / l2l1 / both</td></tr>
    </table></div>
    <h3>Parsing rules</h3>
    <p>• A one-line record is a single line with " | " (or Tab): 2 fields are the sides, the 3rd is the hint, the 4th is tags.<br>• Optional fields (audio, audio1, audio2, hint, tags, alt1, alt2, alt, id, direction, reverse) written as key lines right under a one-line record attach to it. A line with front:, back:, prompt:, answer: starts a new block record.<br>• A block record starts at a field line (prompt:, front:…) and runs until a blank line, "---", a heading, or the next one-line record.<br>• In one-line records ";" splits alternatives (first value is the main one); in block prompt/answer ";" is plain text.<br>• Unknown fields are ignored, the file still parses.<br>• Progress is tied to card text — add an <b>id</b> field to keep it after edits.</p>`},
  {id:'txt', title:'Plain .txt (TSV)', html:`
    <p>For bulk entry use TSV: Tab-separated columns, lines starting with <b>#</b> are comments. Two columns make a flashcard, three columns (prompt, answer, tags) make a task. Paste straight from Excel or Google Sheets.</p>
    ${codebox('hello\tпривет\ndog\tсобака\n\nПривет, как дела?\tHello! How are you?\tgreetings\n')}`},
  {id:'images', title:'Images', html:`
    <p>Images use markdown syntax in any field. Three ways:</p>

    <p>For link-based decks relative paths resolve against the deck file URL. For device uploads select the md/txt together with its images — paths are linked for the current session.</p>
    <p>On a card an image is shown at a fixed size — at most ~170 px tall, proportions kept, so huge photos do not break the layout. png, jpg, webp, gif (including animated), svg and bmp all work; <b>webm</b> is a video, not an image — use gif for animation.</p>`},
  {id:'audio', title:'Audio', html:`
    <p><b>audio</b> (full name <b>audio1</b>) is the side-1 sound: the front of a card or the prompt of a task. <b>audio2</b> is side 2: the back of a card or the answer. When a side with audio is shown, the sound plays <b>once</b> automatically; press <b>P</b> or the 🔊 button to replay. Several audio fields make a playlist with buttons in order.</p>
    <p>Audio is written in a block or as a modifier line under a one-line record — it attaches to the nearest record above:</p>
    ${codebox(['# Карточки','Hello ; Hi | Привет ; Здравствуйте','audio: audio/Hello_Hi.mp3','','front: |','  Good morning, how are you?','back: |','  Добрый день, как дела?','audio: audio/good-morning.mp3','audio2: audio/dobryj-den.mp3',''].join('\n'))}
    <p>A listening task starts with audio; the prompt explains what to do:</p>
    ${codebox(['# Задания','audio: audio/dialogue01.mp3','prompt: What did you hear? Type it in English.','answer: Hello! How are you?',''].join('\n'))}
    <h3>Making your own audio</h3>
    <p>Recommended free generator — <b>edge-tts</b> (Microsoft neural voices):</p>

    <p>Alternatives: gTTS (simple Google voices), Piper (offline), Forvo (human recordings of single words), paid services (Azure TTS, ElevenLabs, OpenAI TTS), or a phone voice recorder. Name files in Latin letters without spaces, keep them in an audio/ folder.</p>`},
  {id:'loading', title:'Loading decks', html:`
    <p><b>Built-in</b> decks ship with the site. <b>Links</b> — raw GitHub URLs: the site downloads and caches them in the browser, so they work offline; "Refresh" pulls edits. <b>Device files</b> — md/txt plus nearby media; the "Choose folder" button takes a whole folder at once: decks inside are found and media is linked by relative paths. Deck text is stored in the browser (localStorage), media lasts for the session. Browser storage is about 5 MB. Move progress between devices with the JSON export/import in Settings.</p>`},
  {id:'progress', title:'Progress', html:`
    <p>Per card the site keeps knew/missed counters, last-seen date and hint count. Session setup offers "Repeat mistakes only". The reset button wipes all progress — export first, it cannot be undone.</p>`},
  {id:'keys', title:'Keyboard', html:`
    <div class="tablewrap"><table>
      <tr><th>Key</th><th>Action</th></tr>
      <tr><td>Space / Enter</td><td>flip card or reveal answer</td></tr>
      <tr><td>1 / 2</td><td>knew / missed</td></tr>
      <tr><td>H</td><td>hint (reveals random letters)</td></tr>
      <tr><td>P</td><td>replay audio of the current side</td></tr>
      <tr><td>F</td><td>flip task direction (⇄)</td></tr>
      <tr><td>Esc</td><td>exit session</td></tr>
    </table></div>
    <p>Keys are bound to physical keyboard buttons and work on any keyboard layout: with a Russian layout selected the same keys do the same thing. On phones a card flips by tapping anywhere on it.</p>`},
  {id:'faq', title:'FAQ', html:`
    <p><b>Images of a local deck disappeared after reload.</b> Device media lives for one session; the text is kept. Put decks on GitHub for permanent images.</p>
    <p><b>Progress reset after editing a card.</b> Progress is tied to text — add an id field.</p>
    <p><b>A link is not added.</b> The file must be publicly accessible; open the URL in a browser to verify.</p>
    <p><b>A task asks in the wrong direction.</b> Press ⇄ or set direction in the file.</p>
    <p><b>Audio does not play by itself.</b> Browsers allow sound only after the first interaction with the page — click or press any key once, then autoplay works on every card. Press P to replay the current side. If there is no sound at all, check the file path and that the file sits next to the deck.</p>
    <p><b>The text contains ";" or " | ".</b> In one-line records ";" splits alternatives and " | " separates fields: escape the bar (\\|); text with ";" should use the block form — there ";" stays plain text and alternatives go to alt1/alt2.</p>`}
  ];
}

/* ============================ actions ============================ */
async function onFilesChosen(fileList){
  const files=[...fileList];
  if(pendingReupload){
    const id=pendingReupload; pendingReupload=null;
    const f=files.find(x=>/\.(md|markdown|txt)$/i.test(x.name));
    if(!f){ toast(t('invalidFile')); rerender(); return; }
    const text=await f.text();
    const deck=parseDeck(text, f.name);
    if(!deck.cards.length){ toast(t('parseEmpty')); rerender(); return; }
    const m=deckMetas.find(x=>x.id===id);
    if(m){ m.text=text; m.name=deck.title; m.savedAt=nowIso(); delete m.error; saveDecks(); toast(t('updated')); }
    registerAssets(id, files);
    rerender();
    return;
  }
  let added=0;
  for(const f of files){
    if(f.name.startsWith('.')) continue;
    if(/\.(md|markdown|txt)$/i.test(f.name)){
      const text=await f.text();
      const deck=parseDeck(text, f.name);
      if(!deck.cards.length){ toast(t('parseEmpty')+': '+f.name); continue; }
      const id=deckIdForLocal(deck.title);
      addDeckFromText(text, f.name, 'local', null);
      registerAssets(id, files);
      added++;
    }
  }
  if(!added){ toast(t('invalidFile')); }
  else { toast(added+' × '+t('added')); }
  rerender();
}
function registerAssets(deckId, files){
  const map={};
  for(const f of files){
    if(f.name.startsWith('.')) continue;
    if(/\.(md|markdown|txt|json)$/i.test(f.name)) continue;
    if(!/^(image|audio)\//.test(f.type||'')) continue;
    const url=URL.createObjectURL(f);
    if(f.webkitRelativePath){
      const rp=f.webkitRelativePath.replace(/^\.\//,'');
      map[rp]=url;
      const noRoot=rp.indexOf('/')>=0 ? rp.slice(rp.indexOf('/')+1) : '';
      if(noRoot) map[noRoot]=url;
    }
    map[f.name]=url;
  }
  if(Object.keys(map).length) localAssets[deckId]=map;
}
const act={
  'set-lang':arg=>{ settings.lang=arg; LANG=arg; saveSettings(); rerender(); },
  'open-setup':arg=>{
    const ids=arg==='all'?deckMetas.map(m=>m.id):[arg];
    pendingSetup={ ids, mode:'mix', direction:'mixed', onlyMistakes:false, tags:[], size:'' };
    rerender();
  },
  'setup-set':(arg,el)=>{
    if(el.dataset.kind==='mode') pendingSetup.mode=arg;
    else pendingSetup.direction=arg;
    rerender();
  },
  'tag':arg=>{
    const i=pendingSetup.tags.indexOf(arg);
    if(i>=0) pendingSetup.tags.splice(i,1); else pendingSetup.tags.push(arg);
    rerender();
  },
  'onlymistakes':()=>{ pendingSetup.onlyMistakes=!pendingSetup.onlyMistakes; rerender(); },
  'setup-start':()=>{
    const sizeEl=document.getElementById('size-input');
    const size=sizeEl&&sizeEl.value?Math.max(1,parseInt(sizeEl.value,10)||0):0;
    const cfg={ deckIds:pendingSetup.ids, mode:pendingSetup.mode, direction:pendingSetup.direction,
                onlyMistakes:pendingSetup.onlyMistakes, tags:pendingSetup.tags.slice(), size };
    pendingSetup=null;
    startSession(cfg);
    rerender();
  },
  'setup-cancel':()=>{ pendingSetup=null; rerender(); },
  'overlay-close':(arg,el,e)=>{ if(e.target===el){ pendingSetup=null; rerender(); } },
  'add-url':()=>{
    const inp=document.getElementById('url-input');
    const url=inp?inp.value.trim():'';
    if(!url){ toast(t('noUrl')); return; }
    addUrl(url);
  },
  'upload':()=>{ document.getElementById('file-input').click(); },
  'upload-folder':()=>{ const el=document.getElementById('folder-input'); if(el) el.click(); },
  'reupload':arg=>{ pendingReupload=arg; document.getElementById('file-input').click(); },
  'refresh':arg=>{ fetchDeckText(arg, false); },
  'delete':arg=>{
    if(!confirm(t('confirmDelete'))) return;
    deckMetas=deckMetas.filter(d=>d.id!==arg);
    saveDecks(); rerender();
  },
  'restore-demo':()=>{
    if(!deckMetas.some(d=>d.id==='builtin:demo-en')){
      deckMetas.unshift(demoDeckMeta());
      saveDecks();
    }
    rerender();
  },
  'export':()=>{
    const blob=new Blob([JSON.stringify({app:'kartochki',version:1,exported:nowIso(),progress},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='kartochki-progress.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },
  'import':()=>{ document.getElementById('import-input').click(); },
  'reset-progress':()=>{
    if(!confirm(t('confirmReset'))) return;
    progress={}; saveProgress(); toast(t('progressCleared')); rerender();
  },
  'flip-card':()=>{ if(!S||S.done)return; const ex=cur(); if(ex.card.type!=='card')return; S.flipped=!S.flipped; playFaceAudio(ex, currentFaceSide(ex)); rerender(); },
  'reveal':()=>actReveal(),
  'hint':()=>actHint(),
  'flip-dir':()=>{ if(S&&!S.done) flipDir(); },
  'grade':arg=>{ if(!S||S.done)return; const ex=cur(); const can=ex.card.type==='card'?S.flipped:S.revealed; if(!can)return; grade(arg==='ok'); },
  'play':arg=>{
    if(!S||S.done)return;
    const ex=cur();
    const [side, idx]=String(arg).split(':');
    const list=audioListFor(ex, side==='2'?'2':'1');
    const i=parseInt(idx,10)||0;
    if(list[i]) playAudioUrl(list[i], ex.deck.metaId);
  },
  'exit':()=>{ S=null; pendingSetup=null; if(location.hash==='#/session'||location.hash==='#/') rerender(); else location.hash='#/'; rerender(); },
  'repeat-mistakes':()=>{
    const cfg=Object.assign({}, S.config, {onlyMistakes:true});
    const hadMistakes=S.bad>0;
    S=null;
    if(hadMistakes){ startSession(cfg); if(!S){ location.hash='#/'; rerender(); } }
    else { toast(t('noMistakes')); location.hash='#/'; rerender(); }
  },
  'goto':arg=>{
    const el=document.getElementById('sec-'+arg);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  },
  'copy':(arg,el)=>{
    const box=el.closest('.codebox');
    const pre=box?box.querySelector('pre'):null;
    if(pre) copyText(pre.textContent);
  }
};
let pendingReupload=null;
async function addUrl(url){
  const existing=deckMetas.find(d=>d.id==='url:'+url);
  if(existing){ fetchDeckText(existing.id, false); return; }
  toast('…');
  try{
    const res=await fetch(url, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const meta=addDeckFromText(text, url, 'url', url);
    if(meta){ toast(t('added')); rerender(); }
  }catch(e){
    toast(t('fetchFail')+': '+e.message);
  }
}

/* ============================ router & boot ============================ */
let rerenderQueued=false;
function rerender(){
  if(rerenderQueued) return;
  rerenderQueued=true;
  requestAnimationFrame(()=>{
    rerenderQueued=false;
    renderApp();
  });
}
function renderApp(){
  const app=document.getElementById('app');
  const h=location.hash||'#/';
  let html;
  if(h.indexOf('#/session')===0 && S) html=sessionView();
  else if(h.indexOf('#/instruction')===0) html=instructionView();
  else html=homeView();
  if(pendingSetup) html+=setupModalHtml();
  app.innerHTML=html;
  bindDynamic();
}
function bindDynamic(){
  const inp=document.getElementById('typed');
  if(inp){
    S.typed=inp.value;
    inp.addEventListener('input',()=>{ S.typed=inp.value; });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); actReveal(); } });
    inp.focus();
    const L=inp.value.length;
    try{ inp.setSelectionRange(L,L); }catch(e){}
  }
  const fs=document.getElementById('fontScale');
  if(fs) fs.addEventListener('change',()=>{ settings.fontScale=parseFloat(fs.value)||1; saveSettings(); applyFontScale(); });
  const fi=document.getElementById('file-input');
  if(fi) fi.addEventListener('change',e=>{ if(e.target.files.length) onFilesChosen(e.target.files); e.target.value=''; });
  const fo=document.getElementById('folder-input');
  if(fo) fo.addEventListener('change',e=>{ if(e.target.files.length) onFilesChosen(e.target.files); e.target.value=''; });
  const fb=document.getElementById('folder-btn');
  if(fb && !('webkitdirectory' in document.createElement('input'))) fb.classList.add('hidden');
  const ii=document.getElementById('import-input');
  if(ii) ii.addEventListener('change',async e=>{
    const f=e.target.files[0]; e.target.value='';
    if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      if(!data || typeof data.progress!=='object') throw new Error('bad');
      let n=0;
      for(const k of Object.keys(data.progress)){
        const v=data.progress[k];
        if(v && typeof v==='object'){ progress[k]={k:v.k||0,m:v.m||0,h:v.h||0,ls:v.ls||''}; n++; }
      }
      saveProgress();
      toast(t('imported')+' ('+n+')');
      rerender();
    }catch(err){ toast(t('invalidFile')); }
  });
  const ui=document.getElementById('url-input');
  if(ui) ui.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); act['add-url'](); } });
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=act[el.dataset.act];
  if(fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('keydown', e=>{
  if(!(location.hash||'').startsWith('#/session') || !S || S.done) return;
  if(pendingSetup) return;
  const tag=(e.target.tagName||'').toUpperCase();
  const inInput=(tag==='INPUT'||tag==='TEXTAREA');
  if(e.code==='Escape'){ act['exit'](); return; }
  if(inInput){
    if(e.code==='Enter'){ e.preventDefault(); actReveal(); }
    return;
  }
  const ex=cur();
  switch(e.code){
    case 'Space':
    case 'Enter':
      e.preventDefault();
      if(ex.card.type==='card') act['flip-card'](); else actReveal();
      break;
    case 'Digit1': case 'Numpad1': act['grade']('ok'); break;
    case 'Digit2': case 'Numpad2': act['grade']('bad'); break;
    case 'KeyH': actHint(); break;
    case 'KeyP': playFaceAudio(cur(), currentFaceSide(cur())); break;
    case 'KeyF': flipDir(); break;
  }
});
window.addEventListener('hashchange', ()=>{ if(location.hash!=='#/session') S=null; renderApp(); });
function applyFontScale(){
  document.documentElement.style.fontSize=Math.round(16*(settings.fontScale||1)*100)/100+'px';
}
function boot(){
  applyFontScale();
  seedBuiltins();
  renderApp();
}
window.LT={ parseDeck, deckMetas:()=>deckMetas, progress:()=>progress, addDeckFromText, startSession, session:()=>S };
boot();
</script>
