<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки — языковой тренажёр</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1c2333; --muted:#6b7487;
  --accent:#4f6ef7; --accent-ink:#ffffff; --ok:#2e9e5b; --ok-bg:#e6f6ec;
  --bad:#d64550; --bad-bg:#fdeaea; --line:#e3e7ef; --chip:#eef1f8;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
  --radius:14px;
  --font-mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono','Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151c; --card:#1b202b; --ink:#e8ecf5; --muted:#9aa3b5;
    --accent:#6c86ff; --accent-ink:#0e1420; --ok:#4fc07f; --ok-bg:#1d3327; --bad:#e36672; --bad-bg:#3a2126;
    --line:#2a3140; --chip:#232a37; --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{font-size:16px}  /* база rem: настройка «Размер шрифта» меняет её через JS, и масштабируется весь интерфейс */
body{background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:860px;margin:0 auto;padding:16px 14px 70px}
h1{font-size:1.35rem;margin:.2rem 0 1rem}
h2{font-size:1.12rem;margin:1.6rem 0 .6rem}
h3{font-size:1rem;margin:1.2rem 0 .4rem}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.err{color:var(--bad);font-size:.85rem}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{margin:0}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang-switch button{border:0;background:transparent;color:var(--muted);padding:.35rem .65rem;cursor:pointer;font-size:.85rem}
.lang-switch button.on{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.55rem .9rem;font-size:.95rem;cursor:pointer;user-select:none;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:.32rem .65rem;font-size:.85rem;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.deck{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.deck .name{font-weight:600;font-size:1.02rem;word-break:break-word}
.badge{display:inline-block;font-size:.72rem;padding:.15rem .5rem;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.meta{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.3rem 1rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:16px}
.panel h3{margin-top:0}
input[type=text],input[type=url],input[type=number],select.sel{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.95rem;font-family:inherit}
select.sel{appearance:none;-webkit-appearance:none}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.fld{display:block;font-size:.85rem;color:var(--muted);margin:.9rem 0 .35rem}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:.28rem .75rem;font-size:.85rem;cursor:pointer;user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
@media(max-width:639px){.sess-top .sess-title{order:9;width:100%;text-align:center}}
select.sel.sel-inline{width:auto;min-width:64px;padding:.28rem .45rem;font-size:.85rem;border-radius:8px}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stage{position:relative}
.tapholder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.3rem;line-height:1.45;word-break:break-word}
.tapholder.small{font-size:1.05rem;cursor:default;align-items:stretch;text-align:left}
.audio-big{font-size:2.6rem;line-height:1;text-align:center;margin-top:4px}
.side-label{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem}
.flip-hint{color:var(--muted);font-size:.8rem;margin-top:14px}
.card-img{max-width:100%;height:auto;max-height:170px;border-radius:10px;margin:.5rem 0}
.divider{height:1px;background:var(--line);margin:16px 0;width:100%}
.grade{display:flex;gap:10px;margin-top:16px}
.grade .btn{flex:1;justify-content:center;padding:.85rem;font-size:1.02rem;border-radius:12px}
.g-ok{color:var(--ok);border-color:var(--ok)}
.g-bad{color:var(--bad);border-color:var(--bad)}
.answer-box{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:.75rem .9rem;margin-top:12px;font-size:1.12rem;word-break:break-word}
.diff-ok{color:var(--ok)}
.diff-no{color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px;text-underline-offset:4px}
.typed-echo{color:var(--muted);font-size:.88rem;margin-top:.5rem;word-break:break-word}
.alts{color:var(--muted);font-size:.85rem;margin-top:.5rem}
.hintline{background:var(--chip);border-radius:10px;padding:.55rem .85rem;margin-top:12px;font-size:1.1rem;letter-spacing:.14em;word-break:break-all}
.hinttext{color:var(--muted);font-size:.9rem;margin-top:10px;font-style:italic}
.keys{color:var(--muted);font-size:.75rem;margin-top:22px;text-align:center}
@media(max-width:639px){.keys{display:none}}
.audio-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* переворот карточки: 0.5 с в обе стороны (новая грань «входит» поворотом) */
@keyframes flipInFwd{from{transform:perspective(900px) rotateY(88deg);opacity:.35}to{transform:perspective(900px) rotateY(0);opacity:1}}
@keyframes flipInBwd{from{transform:perspective(900px) rotateY(-88deg);opacity:.35}to{transform:perspective(900px) rotateY(0);opacity:1}}
.tapholder.flip-fwd{animation:flipInFwd .5s ease both}
.tapholder.flip-bwd{animation:flipInBwd .5s ease both}
@media (prefers-reduced-motion: reduce){.tapholder.flip-fwd,.tapholder.flip-bwd{animation:none}}
.btn.off{opacity:.45}
input[type=range]{accent-color:var(--accent);width:120px;padding:0;vertical-align:middle}
@media(max-width:639px){input[type=range].sess-vol{width:74px}}
.instr{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:760px){.instr{grid-template-columns:225px 1fr;align-items:start}}
.instr nav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-wrap:wrap;gap:4px}
@media(min-width:760px){.instr nav{flex-direction:column;position:sticky;top:12px;flex-wrap:nowrap}}
.instr nav a{padding:.4rem .6rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9rem;cursor:pointer;display:block}
.instr nav a:hover{background:var(--chip)}
.instr .content{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.instr .content section{border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:1.4rem}
.instr .content section:last-child{border-bottom:0;margin-bottom:0}
.codebox{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:.6rem 0 1rem}
.codebox pre{margin:0;font:.78rem/1.55 var(--font-mono);white-space:pre}
.copy{position:absolute;top:6px;right:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6rem 0}
th,td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--chip)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:99;max-width:90vw;box-shadow:var(--shadow)}
</style>
</head>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fnv(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
function nowIso(){ return new Date().toISOString(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let toastTimer=null;
function toast(msg, ms){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>d.remove(), ms||2800);
}
function copyText(text){
  const done=()=>toast(t('copied'));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast(t('copied')); }
    ta.remove();
  }
}

/* ---- PARSER BEGIN (pure functions, no DOM) ---- */
function normalizeText(s){
  return String(s||'').toLowerCase()
    .replace(/ё/g,'е')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[«»"'„“”()\[\]{}¿?¡!.,;:—–\-…]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function normalizeWord(s){ return normalizeText(s); }
function extractFrontmatter(text){
  const lines=text.split('\n');
  if(!lines.length || lines[0].trim()!=='---') return null;
  let end=-1;
  for(let i=1;i<lines.length;i++){ if(lines[i].trim()==='---'){ end=i; break; } }
  if(end<0) return null;
  const meta={};
  for(const l of lines.slice(1,end)){
    const m=l.match(/^([A-Za-z_][\w-]*)\s*:\s*(.*)$/);
    if(m) meta[m[1].toLowerCase()]=m[2].trim().replace(/^["']|["']$/g,'');
  }
  return { meta, body: lines.slice(end+1).join('\n') };
}
// единственный стиль записи: строка с полями через « | » (или Tab) + строки-модификаторы под ней.
// Экранирование в тексте: \| — литеральная черта, \; — литеральная точка с запятой.
const FIELD_KEYS=['hint','audio1','audio2','audio','tags','id','direction','reverse'];
const FIELD_RE=new RegExp('^\\s*('+FIELD_KEYS.join('|')+')\\s*:\\s*(.*)$','i');
function splitPipes(joined){
  for(let i=0;i<joined.length-2;i++){
    if(joined[i]===' ' && joined[i+1]==='|' && joined[i+2]===' ' && (i===0||joined[i-1]!=='\\')){
      return [joined.slice(0,i), joined.slice(i+3)];
    }
  }
  return null;
}
function unesc(s){ return String(s||'').replace(/\\\|/g,'|').replace(/\\;/g,';'); }
// однострочная запись: все вхождения « | » (с учётом экранирования \|) → массив полей
function splitAllPipes(s){
  const parts=[]; let rest=String(s||'');
  for(;;){
    const sp=splitPipes(rest);
    if(!sp){ parts.push(rest); break; }
    parts.push(sp[0]); rest=sp[1];
  }
  return parts.map(x=>x.trim());
}
// «;» в однострочном поле = варианты (первое значение каноничное); \; — литеральная «;»
function splitVariants(v){
  const ps=String(v||'').split(/(?<!\\);/).map(s=>unesc(s).trim()).filter(Boolean);
  return { main: ps[0]||'', alts: ps.slice(1) };
}
function looksLikeRecord(line){
  if(/\t/.test(line)) return true;
  return splitAllPipes(line).length>=2;
}
// однострочная запись → карточка/задание; parts: [сторона1, сторона2, hint?, tags?]
function recordFromParts(parts, section, warnings, src){
  const clip=s=>String(s).slice(0,40)+(s.length>40?'…':'');
  if(parts.length<2 || !parts[0] || !parts[1]){
    if(section==='tasks'||section==='audio') warnings.push('Задание без поля answer пропущено: «'+clip(src)+'»');
    else warnings.push('Строка без « | » пропущена: «'+clip(src)+'»');
    return null;
  }
  const v1=splitVariants(parts[0]), v2=splitVariants(parts[1]);
  // секция задаёт тип жёстко; без заголовка: 2 поля — флеш-карта, 3+ — задание
  const type = (section==='tasks'||section==='audio') ? 'task'
             : (section==='cards' ? 'card' : (parts.length>=3 ? 'task' : 'card'));
  const c={ type, audio:[], tags: parts[3]?parseTags([unesc(parts[3])]):[], alts:v2.alts };
  if(v1.alts.length) c.alt1=v1.alts;
  if(parts[2]) c.hint=unesc(parts[2]);
  if(type==='card'){ c.front=v1.main; c.back=v2.main; }
  else {
    c.prompt=v1.main; c.answer=v2.main;
    if(!c.answer.trim()){ warnings.push('Задание с пустым answer пропущено: «'+clip(src)+'»'); return null; }
  }
  return finalizeCard(c);
}
// аудиозадание секции # Audio: «audio: путь | ответ [ | подсказка | теги]».
// Ключ audio:/audio2: — пометка, чья это озвучка; задание всегда: слушать → вводить текст.
function audioRecordFromParts(parts, warnings, src){
  const clip=s=>String(s).slice(0,40)+(s.length>40?'…':'');
  const path=unesc(parts[0]||'').trim().replace(/^["']|["']$/g,'');
  if(parts.length<2 || !path || !parts[1]){
    warnings.push('Аудиозадание без пути или ответа пропущено: «'+clip(src)+'»');
    return null;
  }
  const v=splitVariants(parts[1]);
  const c={ type:'task', audioTask:true, prompt:'', answer:v.main, alts:v.alts,
            audio:[path], audio1:[], audio2:[],
            tags:parts[3]?parseTags([unesc(parts[3])]):[], direction:'l1l2' };
  if(parts[2]) c.hint=unesc(parts[2]);
  if(!c.answer.trim()){ warnings.push('Аудиозадание с пустым ответом пропущено: «'+clip(src)+'»'); return null; }
  return finalizeCard(c);
}
function parseTags(arr){
  return (arr||[]).join(',').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
}
// необязательное поле, дописанное строкой под записью, прикрепляется к ней
function applyModifier(c, key, v){
  v=String(v||'').trim();
  switch(key){
    case 'audio': case 'audio1': case 'audio2':
      if(v) (c[key]=c[key]||[]).push(v);
      break;
    case 'hint':
      if(v) c.hint=unesc(v);
      break;
    case 'tags':
      if(v) c.tags=c.tags.concat(parseTags([v]));
      break;
    case 'id':
      if(v) c.id=v;
      break;
    case 'direction': {
      const d=v.toLowerCase(); c.direction=['l2l1','l1l2','both'].includes(d)?d:'both';
      break;
    }
    case 'reverse':
      c.reverse=(v.toLowerCase()==='true'||v.toLowerCase()==='yes');
      break;
  }
}
function parseSectionLines(rawLines, section, warnings){
  const lines=rawLines.slice();
  while(lines.length && !lines[0].trim()) lines.shift();
  while(lines.length && !lines[lines.length-1].trim()) lines.pop();
  if(!lines.length) return [];
  const out=[];
  for(const line of lines){
    const s=line.trim();
    if(!s) continue;
    const km=line.match(FIELD_RE);
    const am=km && /^(audio1|audio2|audio)$/i.test(km[1]) && looksLikeRecord(line);
    if(am){
      // «audio: путь | ответ» — задание на слух; только в секции # Audio
      if(section!=='audio'){
        warnings.push('Строка «'+km[1].toLowerCase()+': … | …» — задание на слух, разбирается только в секции # Audio; здесь пропущена');
        continue;
      }
      const rec=audioRecordFromParts(splitAllPipes(km[2]), warnings, s);
      if(rec) out.push(rec);
      continue;
    }
    if(km && !looksLikeRecord(line)){
      // модификатор: прикрепляется к ближайшей записи выше
      const rec=out.length?out[out.length-1]:null;
      if(!rec){ warnings.push('Поле '+km[1].toLowerCase()+': без записи выше — строка пропущена'); continue; }
      applyModifier(rec, km[1].toLowerCase(), km[2]);
      continue;
    }
    if(km){ // известный ключ со « | » в значении — почти наверняка ошибка стиля
      warnings.push('Поле '+km[1].toLowerCase()+': со « | » пропущено — модификатор пишется без « | », текст экранируйте \\|');
      continue;
    }
    if(!/^\s/.test(line) && looksLikeRecord(line)){
      const parts=/\t/.test(line) ? line.split('\t').map(x=>x.trim()) : splitAllPipes(line);
      const rec=recordFromParts(parts, section, warnings, s);
      if(rec) out.push(rec);
      continue;
    }
    warnings.push('Строка без « | » пропущена: «'+s.slice(0,40)+(s.length>40?'…':'')+'»');
  }
  return out;
}
function finalizeCard(c){
  const base = c.type==='card' ? ('card|'+c.front)
             : c.audioTask ? ('audio|'+((c.audio&&c.audio[0])||'')+'|'+c.answer)
             : ('task|'+c.prompt+'|'+c.answer);
  if(!c.id) c.id=fnv(base);
  if(c.type==='card'){
    if(c.alts) c.alts=c.alts.filter(a=>normalizeText(a)!==normalizeText(c.back));
    if(c.alt1) c.alt1=c.alt1.filter(a=>normalizeText(a)!==normalizeText(c.front));
  } else {
    if(c.alts) c.alts=c.alts.filter(a=>normalizeText(a)!==normalizeText(c.answer));
    if(c.alt1) c.alt1=c.alt1.filter(a=>normalizeText(a)!==normalizeText(c.prompt));
  }
  if(c.alt1 && !c.alt1.length) delete c.alt1;
  if(c.alts && !c.alts.length) delete c.alts;
  return c;
}
// секции: флеш-карты, задания, задания на слух — имена любых регистров и языков
const SECTION_ALIAS={
  cards:['карточки','карточка','карты','card','cards'],
  tasks:['задания','задание','task','tasks'],
  audio:['аудио','audio','speech','произношение']
};
function sectionOf(headingText){
  const first=String(headingText||'').toLowerCase().trim().split(/[\s:;,]+/)[0]||'';
  for(const k in SECTION_ALIAS) if(SECTION_ALIAS[k].includes(first)) return k;
  return null;
}
/* ---- автосвязка медиа по именам файлов (чистые функции) ---- */
// «01_Hello_Hi» → {num:1, rest:'hello hi'}; «7» → {num:7, rest:''}; имя без номера → {num:null, rest:…}
function parseAudioStem(stem){
  const s=String(stem||'').replace(/[_\s]+/g,' ').trim();
  const m=s.match(/^(\d{1,3})(?:[ .\-]+(.*))?$/);
  if(!m) return {num:null, rest:normalizeText(s)};
  return {num:parseInt(m[1],10), rest:m[2]?normalizeText(m[2]):''};
}
function normJoin(arr){ return normalizeText((arr||[]).filter(Boolean).join(' ')); }
// имя файла — словесное начало текста: 'hello' ⊑ 'hello hi'
function textPrefixMatch(rest, t){ return !!rest && !!t && (t===rest || t.startsWith(rest+' ')); }
// текст стороны карточки/задания для сравнения с именем файла: основной текст + варианты
function matchTextFor(c, side){
  if(c.audioTask) return '';
  if(side==='1') return c.type==='card' ? normJoin([c.front].concat(c.alt1||[])) : normJoin([c.prompt].concat(c.alt1||[]));
  return c.type==='card' ? normJoin([c.back].concat(c.alts||[])) : normJoin([c.answer].concat(c.alts||[]));
}
function makeDeck(meta, cards, warnings, filename){
  const base=(filename||'Колода').replace(/\.[^.]+$/,'');
  // нумерация записей для автосвязки медиа: карточки — отдельно, задания — отдельно,
  // аудиозадания — отдельно; каждая с 01 в порядке появления (строки-модификаторы не считаются)
  let nc=0, nt=0, na=0;
  for(const c of cards){ c.num = c.audioTask ? (++na) : (c.type==='card' ? (++nc) : (++nt)); }
  return {
    title: String(meta.title||base).trim()||'Колода',
    lang: (meta.lang||'').toLowerCase(),
    base: (meta.base||'').toLowerCase(),
    reverse: /^(true|yes|да|1)$/i.test(meta.reverse||''),
    description: meta.description||'',
    cards, warnings
  };
}
function parseMd(text, filename){
  const warnings=[];
  const fm=extractFrontmatter(text);
  let body=text, meta={};
  if(fm){ meta=fm.meta; body=fm.body; }
  const blocks=[]; let cur=[]; let section=null;
  for(const line of body.split('\n')){
    const h=line.match(/^\s*#{1,6}\s+(.+?)\s*$/);
    if(h){
      if(cur.length){ blocks.push({section, lines:cur}); cur=[]; }
      const sec=sectionOf(h[1]);
      if(sec) section=sec; // неизвестные заголовки секцию не меняют
      continue;
    }
    if(/^\s*-{3,}\s*$/.test(line)){ blocks.push({section, lines:cur}); cur=[]; continue; }
    cur.push(line);
  }
  if(cur.length) blocks.push({section, lines:cur});
  const cards=[];
  for(const b of blocks){
    const list=parseSectionLines(b.lines, b.section, warnings);
    for(const c of list) cards.push(finalizeCard(c));
  }
  return makeDeck(meta, cards, warnings, filename);
}
function parseTsv(text, filename){
  const warnings=[]; const cards=[];
  for(const line of text.split('\n')){
    if(!line.trim() || /^\s*#/.test(line)) continue;
    const cols=line.split('\t').map(c=>c.trim());
    const c1=splitVariants(cols[0]), c2=splitVariants(cols[1]);
    if(cols.length>=3){
      cards.push(finalizeCard({ type:'task', prompt:c1.main, answer:c2.main, alt1:c1.alts, alts:c2.alts, audio:[], tags:parseTags([cols[2]]) }));
    } else if(cols.length>=2){
      cards.push(finalizeCard({ type:'card', front:c1.main, back:c2.main, alt1:c1.alts, alts:c2.alts, audio:[], tags:[] }));
    } else {
      warnings.push('Строка без Tab-разделителя пропущена: «'+line.trim().slice(0,40)+'…»');
    }
  }
  return makeDeck({}, cards, warnings, filename);
}
function parseDeck(text, filename){
  text=String(text||'').replace(/\r\n?/g,'\n');
  if(/\.txt$/i.test(filename||'')) return parseTsv(text, filename);
  return parseMd(text, filename);
}
function diffTokens(answer, typed){
  const a=String(answer||'').split(/\s+/).filter(Boolean);
  const b=String(typed||'').split(/\s+/).filter(Boolean);
  const n=a.length, m=b.length;
  const eq=(x,y)=>normalizeWord(x)===normalizeWord(y);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=eq(a[i],b[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const res=[]; let i=0,j=0;
  while(i<n && j<m){
    if(eq(a[i],b[j])){ res.push({t:a[i],ok:true}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ res.push({t:a[i],ok:false}); i++; }
    else { j++; }
  }
  while(i<n){ res.push({t:a[i],ok:false}); i++; }
  return res;
}
function isExact(answer, typed, alts){
  const nt=normalizeText(typed);
  if(!nt) return false;
  return normalizeText(answer)===nt || (alts||[]).some(x=>normalizeText(x)===nt);
}
const VISIBLE_CH=/[\s¿?¡!.,;:«»"'„“”(){}\[\]\-–—…]/;
function buildMask(target, revealed){
  return [...String(target||'')].map((ch,i)=> (VISIBLE_CH.test(ch)||revealed.has(i)) ? ch : '•').join('');
}
function nextRevealIndex(target, revealed){
  const idx=[];
  [...String(target||'')].forEach((ch,i)=>{ if(!VISIBLE_CH.test(ch) && !revealed.has(i)) idx.push(i); });
  if(!idx.length) return null;
  return idx[Math.floor(Math.random()*idx.length)];
}

const deckCache={};
function getDeck(meta){
  const ck=meta.id+'|'+fnv(meta.text||'');
  if(deckCache[ck]) return deckCache[ck];
  const fname=meta.url||meta.name||'x.md';
  const isTxt=/\.txt$/i.test(fname);
  const d=parseDeck(meta.text||'', isTxt?'x.txt':fname);
  d.metaId=meta.id;
  deckCache[ck]=d;
  return d;
}

// Единый индекс всех выбранных аудио и картинок (мультивыбор, папка, ZIP).
// Предзагрузка: при выборе источник целиком индексируется в blob-URL,
// дальше воспроизведение и показ идут из памяти — без сетевых запросов.
const mediaLib={ files:{}, items:[], audio:0, image:0 };
let mediaRev=0; // растёт при любом изменении библиотеки — сбрасывает кеш автосвязки
const AUDIO_EXT=/\.(mp3|ogg|oga|m4a|aac|wav|flac|opus|weba)$/i;
const IMAGE_EXT=/\.(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/i;
function isMediaFile(name, type){
  if(type && /^(image|audio)\//i.test(type)) return true;
  return AUDIO_EXT.test(name)||IMAGE_EXT.test(name);
}
function mimeFor(name){
  const m=String(name).toLowerCase();
  if(/\.mp3$/.test(m)) return 'audio/mpeg';
  if(/\.(ogg|oga|opus)$/.test(m)) return 'audio/ogg';
  if(/\.m4a$/.test(m)) return 'audio/mp4';
  if(/\.aac$/.test(m)) return 'audio/aac';
  if(/\.wav$/.test(m)) return 'audio/wav';
  if(/\.flac$/.test(m)) return 'audio/flac';
  if(/\.weba$/.test(m)) return 'audio/webm';
  if(/\.png$/.test(m)) return 'image/png';
  if(/\.jpe?g$/.test(m)) return 'image/jpeg';
  if(/\.gif$/.test(m)) return 'image/gif';
  if(/\.webp$/.test(m)) return 'image/webp';
  if(/\.svg$/.test(m)) return 'image/svg+xml';
  if(/\.bmp$/.test(m)) return 'image/bmp';
  if(/\.avif$/.test(m)) return 'image/avif';
  if(/\.ico$/.test(m)) return 'image/x-icon';
  return '';
}
// один файл кладётся в индекс под несколькими ключами: путь целиком,
// путь без корневой папки, имя файла и то же имя в нижнем регистре
function putMediaKey(map, key, url){
  if(!key) return;
  const k=String(key).replace(/^\.\//,'').replace(/\\/g,'/');
  if(!map[k]) map[k]=url;
  if(k.indexOf('/')>=0){
    const tail=k.slice(k.indexOf('/')+1);
    if(tail && !map[tail]) map[tail]=url;
  }
  const base=k.split('/').pop()||k;
  if(!map[base]) map[base]=url;
  const low=base.toLowerCase();
  if(!map[low]) map[low]=url;
}
function mediaCount(files){
  let a=0, i=0;
  for(const f of files){
    if(/^audio\//i.test(f.type||'')||(!f.type && AUDIO_EXT.test(f.name))) a++; else i++;
  }
  return [a,i];
}
// русские формы числительных: plural(5,'колода','колоды','колод') → «колод»
function plural(n, one, few, many){
  const m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return few;
  return many;
}
function imgWord(n){ return LANG==='ru' ? plural(n,'картинка','картинки','картинок') : (n===1?'image':'images'); }
function mediaStatsToast(n,a,i){
  if(!n) return '';
  return t('mediaLoaded')+': '+n+' ('+a+' '+t('mediaAudio')+' · '+i+' '+imgWord(i)+')';
}
// cohort — «источник загрузки» (корень папки / имя zip / метка мультивыбора):
// медиа и колода из одного источника связываются между собой в первую очередь
function rootCohortOf(f){
  const rp=String(f.webkitRelativePath||'');
  if(rp && rp.indexOf('/')>0) return rp.split('/')[0];
  return '';
}
function registerMediaLib(files, defaultCohort){
  const media=[...files].filter(f=>{
    if(f.name.startsWith('.')) return false;
    if(/\.zip$/i.test(f.name)) return false;
    if(/\.(md|markdown|txt|json)$/i.test(f.name)) return false;
    return isMediaFile(f.name, f.type);
  });
  if(!media.length) return [0,0,0];
  for(const f of media){
    const url=URL.createObjectURL(f);
    putMediaKey(mediaLib.files, f.webkitRelativePath||f.name, url);
    putMediaKey(mediaLib.files, f.name, url);
    mediaLib.items.push({path:f.webkitRelativePath||f.name, url, cohort:rootCohortOf(f)||defaultCohort||''});
  }
  const [a,i]=mediaCount(media);
  mediaLib.audio+=a; mediaLib.image+=i;
  mediaRev++;
  toast(mediaStatsToast(a+i,a,i), 4000);
  return [a+i,a,i];
}
function clearMediaLib(){
  for(const k of Object.keys(mediaLib.files)){ try{ URL.revokeObjectURL(mediaLib.files[k]); }catch(e){} }
  mediaLib.files={}; mediaLib.items=[]; mediaLib.audio=0; mediaLib.image=0;
  mediaRev++;
}
// поиск файла в библиотеке: точный путь → имя файла → имя в нижнем регистре
function mediaFind(src){
  if(/^(https?:|data:|blob:)/i.test(src)) return src;
  const clean=String(src).replace(/^\.\//,'').replace(/\\/g,'/');
  const lib=mediaLib.files;
  const base=clean.split('/').pop()||clean;
  return lib[clean]||lib[base]||lib[base.toLowerCase()]||null;
}
function resolverFor(metaId){
  const meta=deckMetas.find(m=>m.id===metaId);
  return src=>{
    if(/^(https?:|data:|blob:)/i.test(src)) return src;
    if(meta && meta.kind==='local'){
      const map=localAssets[meta.id]||{};
      const clean=src.replace(/^\.\//,'');
      const base=clean.split('/').pop()||clean;
      const hit=map[clean]||map[base]||map[base.toLowerCase()];
      if(hit) return hit;
    }
    const g=mediaFind(src);
    if(g) return g;
    if(meta && meta.url){
      try{ return new URL(src, meta.url).href; }catch(e){ return src; }
    }
    return src;
  };
}
/* ============================ автосвязка аудио ============================ */
// Порядок поиска звука для стороны карточки/задания:
//   1) строки audio:/audio1:/audio2: — ручное указание, всегда главный источник;
//   2) нумерованный файл NN_текст.ext — номер находит запись, текст решает, чья это сторона;
//   3) файл NN.ext без текста — общая озвучка карточки (играет на обеих сторонах;
//      если записи-карточки с таким номером нет — озвучка стороны 1 задания);
//   4) файл без номера, имя которого равно тексту стороны (тексты до 6 слов);
//   5) синтез речи браузера, если он включён и файла нет.
// Записи считаются при разборе: карточки с 01 отдельно, задания с 01 отдельно, аудиозадания отдельно.
const matchCache={};
function audioMatchItems(){
  const seen=new Set(); const out=[];
  for(const it of mediaLib.items){
    if(seen.has(it.url)) continue; seen.add(it.url);
    const base=(it.path||'').split('/').pop()||'';
    if(!AUDIO_EXT.test(base)) continue;
    const dot=base.lastIndexOf('.');
    const stem=dot>0?base.slice(0,dot):base;
    const p=parseAudioStem(stem);
    out.push({name:base, num:p.num, rest:p.rest, url:it.url, used:false, cohort:it.cohort||''});
  }
  return out;
}
// Трёхфазный глобальный матчинг. Файлы потребляются глобально (it.used):
//   фаза 1 — текстовые привязки (номер+текст, имя без номера) у ВСЕХ колод; текстовое
//            совпадение — «доказательство принадлежности» файла колоде;
//   фаза 2 — bare-файлы NN.ext (общая озвучка обеих сторон): приоритет у колод с доказанной
//            автосвязкой; builtin-колоды (демо) не претендуют вовсе;
//   фаза 3 — остатки: одиночный нераспознанный файл номера встаёт на свободную сторону записи,
//            уже имеющей текстовый файл; нераспознанные файлы попадают в «Аудио без пары»
//            только у колоды, имеющей отношение к номеру (доказанная автосвязка, или во всей
//            системе нет ни одной такой колоды). Без этого правила файлы одной колоды
//            «приписывались» соседней, у которой совпал лишь номер записи.
function deckPhase1(deck, items){
  const wc=s=>s?s.split(' ').length:0;
  const byId={}; const byNum={}; let deckTextMatched=0;
  for(const c of deck.cards){
    if(c.audioTask || !c.num) continue;
    const r={s1:[], s2:[]}; byId[c.id]=r; byNum[c.num]=r;
    const t1=matchTextFor(c,'1'), t2=matchTextFor(c,'2');
    const numItems=items.filter(it=>it.num===c.num && !it.used && it.rest);
    for(const it of numItems){
      if(textPrefixMatch(it.rest, t1)){ r.s1.push(it.url); it.used=true; deckTextMatched++; }
      else if(textPrefixMatch(it.rest, t2)){ r.s2.push(it.url); it.used=true; deckTextMatched++; }
    }
    // связка по имени без номера — только для коротких текстов и пустой стороны
    if(!r.s1.length && wc(t1)<=6){
      const hit=items.find(it=>!it.used && it.num===null && it.rest && it.rest===t1);
      if(hit){ r.s1.push(hit.url); hit.used=true; deckTextMatched++; }
    }
    if(!r.s2.length && wc(t2)<=6){
      const hit=items.find(it=>!it.used && it.num===null && it.rest && it.rest===t2);
      if(hit){ r.s2.push(hit.url); hit.used=true; deckTextMatched++; }
    }
    r.selfText=r.s1.length+r.s2.length; // текстовое доказательство принадлежности
  }
  return {byId, byNum, deckTextMatched, bare:0, resid:0};
}
// приоритет колоды-кандидата для конкретного файла: сначала «своя» по cohort (файлы,
// загруженные вместе с колодой — одна папка или один zip), затем не-builtin, затем по
// числу текстовых привязок; cohort нет у всех — как раньше, по доказательствам и порядку
function deckCandidateCompare(a, b, cohort){
  const ca=(cohort && a.m.cohort===cohort)?0:1, cb=(cohort && b.m.cohort===cohort)?0:1;
  if(ca!==cb) return ca-cb;
  const av=a.builtin?1:0, bv=b.builtin?1:0;
  if(av!==bv) return av-bv;
  return (b.st.deckTextMatched||0)-(a.st.deckTextMatched||0);
}
// одиночный остаток номера — на свободную сторону записи, у которой другая сторона уже занята текстовым файлом
function deckPhase3a(state, deck, items){
  if(state.builtin) return;
  for(const c of deck.cards){
    const r=state.st.byId[c.id]; if(!r) continue;
    if(!(r.selfText>0)) continue;
    const rest=items.filter(it=>it.num===c.num && !it.used && it.rest);
    if(rest.length!==1) continue;
    const it=rest[0];
    if(r.s1.length && !r.s2.length){ r.s2.push(it.url); it.used=true; state.st.resid++; }
    else if(!r.s1.length){ r.s1.push(it.url); it.used=true; state.st.resid++; }
  }
}
// общий конвейер фаз 2-3 над готовыми state'ами колод (общие items с флагами used)
function matchPipeline(states, items){
  const anyTextProof=states.some(s=>s.st.deckTextMatched>0);
  // фаза 2: каждый bare-файл NN.ext — лучшему кандидату: cohort → не-builtin → доказанная автосвязка
  for(const it of items){
    if(it.used || it.rest || it.num===null) continue;
    const cands=states.filter(s=>!s.builtin && s.st.byNum[it.num]);
    if(!cands.length) continue;
    cands.sort((a,b)=>deckCandidateCompare(a,b,it.cohort));
    const s=cands[0], r=s.st.byNum[it.num];
    r.s1.push(it.url); r.s2.push(it.url); it.used=true; s.st.bare++;
  }
  // фаза 3a: одиночный остаток номера — на свободную сторону записи, у которой
  // другая сторона уже занята текстовым файлом
  for(const s of states) deckPhase3a(s, s.deck, items);
  // фаза 3b: нераспознанные файлы — «Аудио без пары» у колоды, имеющей отношение к номеру:
  // своя по cohort, или с доказанной автосвязкой, или (если доказательств нет ни у кого)
  // первая пользовательская колода с записью этого номера
  for(const it of items){
    if(it.used || !it.rest || it.num===null) continue;
    const cands=states.filter(s=>!s.builtin && s.st.byNum[it.num] &&
      (s.st.deckTextMatched>0 || !anyTextProof || (it.cohort && s.m.cohort===it.cohort)));
    if(!cands.length) continue;
    cands.sort((a,b)=>{
      const ca=(it.cohort && a.m.cohort===it.cohort)?0:1, cb=(it.cohort && b.m.cohort===it.cohort)?0:1;
      if(ca!==cb) return ca-cb;
      const pa=(a.st.deckTextMatched>0)?0:1, pb=(b.st.deckTextMatched>0)?0:1;
      if(pa!==pb) return pa-pb;
      return (b.st.deckTextMatched||0)-(a.st.deckTextMatched||0);
    });
    cands[0].unmatched.push(it.name); it.used=true;
  }
}
// все колоды считаются в порядке приоритета: пользовательские раньше встроенных,
// иначе встроенная демо-колода перетянет нумерованные файлы пользователя (01.mp3 → её карточка №1)
function computeAllMatches(){
  const revKey='computed|'+mediaRev;
  if(matchCache[revKey]) return;
  const items=audioMatchItems();
  const metas=deckMetas.slice().sort((a,b)=>(a.kind==='builtin'?1:0)-(b.kind==='builtin'?1:0));
  const states=[];
  for(const m of metas){
    const deck=getDeck(m);
    if(!deck){ matchCache[m.id+'|'+mediaRev]={byId:{}, unmatched:[], matchedCount:0}; continue; }
    states.push({m, deck, builtin:m.kind==='builtin', st:deckPhase1(deck, items), unmatched:[]});
  }
  matchPipeline(states, items);
  for(const s of states){
    const cnt=s.st.deckTextMatched + s.st.bare + s.st.resid;
    for(const r of Object.values(s.st.byId)) delete r.selfText; // служебное поле наружу не идёт
    matchCache[s.m.id+'|'+mediaRev]={byId:s.st.byId, unmatched:s.unmatched, matchedCount:cnt};
  }
  matchCache[revKey]=true;
}
function matchResultFor(deck){
  const empty={byId:{}, unmatched:[], matchedCount:0};
  if(!deck) return empty;
  const key=(deck.metaId||'local')+'|'+mediaRev;
  if(!matchCache[key]){
    computeAllMatches();
    if(!matchCache[key]){ // колода не из deckMetas (тесты) — считаем на клоне файлов
      const items=audioMatchItems().map(it=>Object.assign({}, it));
      const st=deckPhase1(deck, items);
      const state={m:{id:deck.metaId||'local', cohort:deck.cohort}, deck, builtin:deck.builtinMatch===true, st, unmatched:[]};
      matchPipeline([state], items);
      const cnt=st.deckTextMatched + st.bare + st.resid;
      for(const r of Object.values(st.byId)) delete r.selfText;
      matchCache[key]={byId:st.byId, unmatched:state.unmatched, matchedCount:cnt};
    }
  }
  return matchCache[key]||empty;
}
function matchedAudioFor(ex, side){
  const res=matchResultFor(ex.deck);
  const r=res.byId[ex.card.id];
  return r ? ((side==='2'?r.s2:r.s1)||[]) : [];
}
function upsertDeck(meta){
  const i=deckMetas.findIndex(d=>d.id===meta.id);
  if(i>=0) deckMetas[i]=meta; else deckMetas.push(meta);
  saveDecks();
}
function addDeckFromText(text, name, kind, url, cohort){
  const deck=parseDeck(text, url||name);
  if(!deck.cards.length){ toast(t('parseEmpty')); return null; }
  const id = kind==='url' ? 'url:'+url : deckIdForLocal(deck.title);
  const meta={ id, kind, name:deck.title, url:url||'', text, savedAt:nowIso() };
  const ch=cohort||'';
  const prev=deckMetas.find(d=>d.id===id);
  if(ch) meta.cohort=ch; // «своя» папка/архив: медиа из того же источника приоритетнее
  else if(prev && prev.cohort) meta.cohort=prev.cohort; // перезагрузка без папки не рвёт связь
  delete meta.error;
  upsertDeck(meta);
  return meta;
}
function demoDeckMeta(){
  return { id:'builtin:demo-en', kind:'builtin', name:'Английский A1 — Приветствия и знакомство', url:'', text:DEMO_DECK, savedAt:nowIso() };
}
function seedBuiltins(){
  let changed=false;
  // миграция: старая испанская демо-колода заменяется английской
  const legacy=deckMetas.findIndex(d=>d.id==='builtin:demo-es');
  if(legacy>=0){ deckMetas.splice(legacy,1); changed=true; }
  const demoId='builtin:demo-en';
  const dm=deckMetas.find(d=>d.id===demoId);
  if(!dm){
    deckMetas.unshift(demoDeckMeta());
    changed=true;
  } else if(dm.text!==DEMO_DECK){
    // встроенная демо-колода всегда синхронизируется с текущей версией сайта; прогресс сохраняется по id карточек
    dm.text=DEMO_DECK;
    dm.name=demoDeckMeta().name;
    changed=true;
  }
  for(const r of RECOMMENDED_DECKS){
    if(!r.url) continue;
    const id='builtin:'+fnv(r.url);
    if(!deckMetas.some(d=>d.id===id)){
      deckMetas.push({ id, kind:'builtin', name:r.name||r.url, url:r.url, text:'', savedAt:'' });
      changed=true;
      fetchDeckText(id, true);
    }
  }
  if(changed) saveDecks();
}
async function fetchDeckText(id, silent){
  const m=deckMetas.find(d=>d.id===id);
  if(!m || !m.url) return;
  try{
    const res=await fetch(m.url, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    m.text=await res.text();
    m.savedAt=nowIso();
    delete m.error;
    const d=parseDeck(m.text, m.url);
    if(d.cards.length) m.name=d.title;
    saveDecks();
    if(!silent){ toast(t('updated')); rerender(); }
    else rerender();
  }catch(e){
    m.error=e.message; saveDecks();
    if(!silent){ toast(t('fetchFail')+': '+e.message); rerender(); }
    else rerender();
  }
}

/* ============================ audio ============================ */
// путь к аудио пробуем по цепочке: blob из выбранных файлов → медиа-библиотека → рядом со страницей → от URL колоды → как написано
function audioCandidates(src, metaId){
  const out=[]; const push=u=>{ if(u && !out.includes(u)) out.push(u); };
  if(/^(https?:|data:|blob:)/i.test(src)){ push(src); return out; }
  const meta=deckMetas.find(m=>m.id===metaId);
  if(meta && meta.kind==='local'){
    const map=localAssets[meta.id]||{};
    const clean=src.replace(/^\.\//,'');
    const base=clean.split('/').pop()||clean;
    push(map[clean]); push(map[base]); push(map[base.toLowerCase()]);
  }
  push(mediaFind(src));
  try{ push(new URL(src, location.href).href); }catch(e){}
  if(meta && meta.url){ try{ push(new URL(src, meta.url).href); }catch(e){} }
  push(src);
  return out;
}
const audioMissed={}; // тост «Аудио недоступно» — один раз на путь, без спама
function tryAudioCand(cands, i, src){
  if(i>=cands.length){
    if(!audioMissed[src]){ audioMissed[src]=true; toast(t('audioFail')+': '+src); }
    return;
  }
  let settled=false;
  const next=err=>{
    if(settled) return; settled=true;
    if(err && err.name==='NotAllowedError'){ toast(t('audioBlocked')); return; }
    tryAudioCand(cands, i+1, src);
  };
  try{
    const a=new Audio(cands[i]);
    a.volume=outVolume();
    a.addEventListener('error', ()=>next(null), {once:true});
    const p=a.play();
    if(p && p.then) p.then(()=>{ settled=true; delete audioMissed[src]; }).catch(next);
    else settled=true;
  }catch(e){ next(null); }
}
function playAudioUrl(src, metaId){
  tryAudioCand(audioCandidates(src, metaId), 0, src);
}
// audio/audio1 — озвучка стороны 1 (front/prompt), audio2 — стороны 2 (back/answer).
// Если строк audio нет — берётся автосвязка (нумерация NN_текст / NN / имя файла).
function audio1Of(c){ return ((c.audio1||[]).concat(c.audio||[])).filter(Boolean); }
function audio2Of(c){ return (c.audio2||[]).filter(Boolean); }
function audioListFor(ex, side){
  const list = side==='2' ? audio2Of(ex.card) : audio1Of(ex.card);
  if(list.length) return list;
  return matchedAudioFor(ex, side);
}

/* ============================ синтез речи ============================ */
// Запаска для сторон без своего аудио (особенно предложения): текст читает голос браузера.
// Язык берётся из шапки колоды (lang/base), при неопределённости — по алфавиту текста.
// Включение/выключение: настройки на главной и кнопка 🗣 в сессии; громкость — общий слайдер.
// Голоса Chrome отдаёт не сразу (getVoices() пуст до voiceschanged) — без ожидания
// браузер читает системным голосом по умолчанию: на русской Windows всё звучит по-русски.
let ttsVoices=[]; let ttsVoicesReady=false;
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  const load=()=>{ try{ const v=speechSynthesis.getVoices(); if(v && v.length){ ttsVoices=v; ttsVoicesReady=true; } }catch(e){} };
  load();
  try{ speechSynthesis.addEventListener('voiceschanged', load, {once:false}); }
  catch(e){ try{ speechSynthesis.onvoiceschanged=load; }catch(e2){} }
}
function pickVoice(prefix){
  if(!ttsVoices.length) return null;
  const pref=String(prefix||'').toLowerCase();
  if(!pref) return null;
  const scored=ttsVoices.filter(v=>v.lang && v.lang.toLowerCase().replace('_','-').startsWith(pref));
  // локальные (установленные в системе) голоса обычно качественнее сетевых
  return scored.find(v=>v.localService) || scored[0] || null;
}
function ttsAvailable(){
  return ('speechSynthesis' in window) && settings.tts!==false && !settings.muted;
}
function stopSpeech(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
function outVolume(){ return settings.muted?0:Math.max(0,Math.min(1,Number(settings.volume)||0)); }
function localeFor(prefix){
  const map={en:'en-US',ru:'ru-RU',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',pt:'pt-PT',uk:'uk-UA',pl:'pl-PL',tr:'tr-TR'};
  return map[prefix] || (prefix?prefix+'-'+prefix.toUpperCase():'');
}
function sideLang(ex, side){
  const d=ex.deck||{};
  const raw=side==='2' ? (d.base||'') : (d.lang||'');
  const prefix=String(raw||'').slice(0,2).toLowerCase();
  if(prefix) return prefix;
  // язык стороны не указан в шапке — определяем по алфавиту текста самой стороны
  const text=String(textOfSide(ex, side)||'');
  return /[\u0400-\u04FF]/.test(text)?'ru':'en';
}
function textOfSide(ex, side){
  const c=ex.card;
  if(c.audioTask) return c.answer;
  if(side!=='2') return c.type==='card'?c.front:c.prompt;
  return c.type==='card'?c.back:c.answer;
}
function speakSide(ex, side){
  if(!ttsAvailable()) return;
  const text=String(textOfSide(ex, side)||'').trim();
  if(!text) return;
  let prefix=sideLang(ex, side);
  if(!prefix) prefix=/[\u0400-\u04FF]/.test(text)?'ru':'en';
  speak(text, prefix);
}
function speak(text, prefix){
  if(!ttsAvailable() || !text) return;
  stopSpeech();
  const go=()=>{
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=localeFor(prefix)||'en-US';
      u.volume=outVolume();
      const v=pickVoice(prefix);
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  };
  if(ttsVoicesReady){ go(); return; }
  // голоса ещё не пришли (первое обращение) — ждём voiceschanged, максимум 1.2 с
  let done=false;
  const fire=()=>{ if(done) return; done=true; go(); };
  try{
    speechSynthesis.addEventListener('voiceschanged', fire, {once:true});
  }catch(e){ try{ speechSynthesis.onvoiceschanged=fire; }catch(e2){} }
  setTimeout(()=>{ try{ speechSynthesis.removeEventListener('voiceschanged', fire); }catch(e){}
    initVoices(); fire(); }, 1200);
}
// сторона, которая показывается первой (до переворота/раскрытия)
function initialFaceSide(ex){
  if(ex.card.type==='card') return ex.dir==='l2l1' ? '1' : '2';
  return ex.dir==='l1l2' ? '1' : '2';
}
// сторона, которая на экране прямо сейчас
function currentFaceSide(ex){
  const first=initialFaceSide(ex);
  const shown=(ex.card.type==='card') ? S.flipped : S.revealed;
  return shown ? (first==='1'?'2':'1') : first;
}
// автоплей: ровно один раз на показ стороны (клик/клавиша уже были — браузер разрешает звук).
// Файла нет → синтез речи (если включён).
function playFaceAudio(ex, side){
  const list=audioListFor(ex, side);
  if(list.length){ playAudioUrl(list[0], ex.deck.metaId); return; }
  speakSide(ex, side);
}

/* ============================ session ============================ */
let S=null;          // текущая сессия
let pendingSetup=null;
function startSession(config){
  const decks=config.deckIds
    .map(id=>{ const m=deckMetas.find(x=>x.id===id); return m?getDeck(m):null; })
    .filter(Boolean);
  const exs=[];
  for(const d of decks){
    for(const c of d.cards){
      // режим сессии фильтрует тип упражнений: в «Заданиях» карточек быть не должно
      if(config.mode==='cards' && c.type!=='card') continue;
      if(config.mode==='tasks' && c.type!=='task') continue;
      if(config.tags.length && !c.tags.some(tg=>config.tags.includes(tg))) continue;
      let dirs;
      if(c.type==='card'){
        const rev=(c.reverse!==undefined)?c.reverse:d.reverse;
        dirs=rev?['l2l1','l1l2']:['l2l1'];
      } else {
        const dir=c.direction||'both';
        dirs=dir==='both'?['l1l2','l2l1']:[dir];
      }
      for(const dir of dirs){
        if(config.direction!=='mixed' && config.direction!==dir) continue;
        if(config.onlyMistakes){
          const r=progress[progKey(d.metaId,c.id)];
          if(!r || !r.m) continue;
        }
        exs.push({deck:d, card:c, dir});
      }
    }
  }
  if(!exs.length){ toast(t('noCards')); return; }
  shuffle(exs);
  const list=config.size ? exs.slice(0, config.size) : exs;
  S={ exs:list, i:0, flipped:false, revealed:false, typed:'', showHint:false,
      revealedLetters:new Set(), hintPresses:0, hintsTotal:0,
      ok:0, bad:0, done:false, config };
  playFaceAudio(cur(), initialFaceSide(cur()));
  if(location.hash==='#/session') rerender(); else location.hash='#/session';
}
function cur(){
  const ex=S.exs[S.i];
  return { deck:ex.deck, card:ex.card, dir:S.dirOverrides && S.dirOverrides[S.i] ? S.dirOverrides[S.i] : ex.dir, idx:S.i };
}
function sides(ex){
  const c=ex.card;
  if(c.type==='card') return ex.dir==='l2l1' ? {a:c.front,b:c.back} : {a:c.back,b:c.front};
  return ex.dir==='l1l2' ? {a:c.prompt,b:c.answer} : {a:c.answer,b:c.prompt};
}
function resetExerciseState(){
  S.flipped=false; S.revealed=false; S.typed=''; S.showHint=false;
  S.revealedLetters=new Set(); S.hintPresses=0; S.flipAnim=null;
}
function flipDir(){
  const ex=cur();
  if(ex.card.direction && ex.card.direction!=='both'){ toast(t('dirFixed')); return; }
  const other=ex.dir==='l2l1'?'l1l2':'l2l1';
  S.dirOverrides=S.dirOverrides||{};
  S.dirOverrides[S.i]=other;
  resetExerciseState();
  playFaceAudio(cur(), initialFaceSide(cur()));
  rerender();
}
function grade(ok){
  const ex=cur();
  const rec=recFor(progKey(ex.deck.metaId, ex.card.id));
  if(ok){ rec.k++; S.ok++; } else { rec.m++; S.bad++; }
  rec.h=(rec.h||0)+S.hintPresses;
  rec.ls=nowIso();
  saveProgress();
  S.i++;
  resetExerciseState();
  if(S.i>=S.exs.length){ S.done=true; }
  else playFaceAudio(cur(), initialFaceSide(cur()));
  rerender();
}
function actReveal(){
  if(!S || S.done) return;
  const ex=cur();
  if(ex.card.type!=='task' || S.revealed) return;
  const inp=document.getElementById('typed');
  if(inp) S.typed=inp.value;
  S.revealed=true;
  playFaceAudio(cur(), currentFaceSide(cur()));
  rerender();
}
function actHint(){
  if(!S || S.done) return;
  const ex=cur();
  if(ex.card.type==='card'){
    if(!ex.card.hint) return;
    S.showHint=!S.showHint;
    rerender();
    return;
  }
  if(S.revealed) return;
  const b=sides(ex).b;
  const idx=nextRevealIndex(b, S.revealedLetters);
  if(idx==null){ toast(t('hintAllShown')); return; }
  S.revealedLetters.add(idx);
  S.hintPresses++; S.hintsTotal++;
  rerender();
}

function rich(text, ex){
  const res=resolverFor(ex.deck.metaId);
  let s=esc(text);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,alt,src)=>`<img class="card-img" src="${esc(res(src.trim()))}" alt="${esc(alt)}" loading="lazy">`);
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\n/g,'<br>');
  return s;
}
function audioRowHtml(ex, side){
  const s=side||'1';
  const list=audioListFor(ex, s);
  const canTts=!list.length && ttsAvailable() && String(textOfSide(ex, s)||'').trim();
  if(!list.length && !canTts) return '';
  const buttons=list.map((u,i)=>`<button class="btn btn-sm" data-act="play" data-arg="${s}:${i}" title="${esc(u)}">🔊 ${esc(t('audio'))}${list.length>1?' '+(i+1):''}</button>`).join('');
  const speakBtn=canTts?`<button class="btn btn-sm" data-act="speak" data-arg="${s}" title="${esc(t('ttsOn'))}">🔊 ${esc(t('audio'))}</button>`:'';
  return `<div class="audio-row">${buttons}${speakBtn}</div>`;
}

function cardStageHtml(ex, a, b){
  const flipped=S.flipped;
  // варианты принадлежат своей стороне: сторона 1 → alt1, сторона 2 → alts
  const face1=(ex.dir==='l2l1') ? !flipped : flipped;
  const variants=((face1?ex.card.alt1:ex.card.alts)||[]);
  const hintBtn=(!flipped && ex.card.hint)
    ? `<div class="row" style="margin-top:10px"><button class="btn btn-sm" data-act="hint">${esc(t('hint'))}</button></div>`:'';
  const hintLine=(S.showHint && ex.card.hint)
    ? `<div class="hinttext">${esc(t('hintField'))} ${esc(ex.card.hint)}</div>`:'';
  return `<div class="stage">
    <div class="tapholder ${S.flipAnim?('flip-'+S.flipAnim):''}" data-act="flip-card">
      <div class="side-label">${flipped?esc(t('sideB')):esc(t('sideA'))}</div>
      <div>${rich(flipped?b:a, ex)}</div>
      ${variants.length?`<div class="alts">${esc(t('variants'))} ${esc(variants.join('; '))}</div>`:''}
      ${!flipped?`<div class="flip-hint">${esc(t('tapToFlip'))}</div>`:''}
    </div>
    ${audioRowHtml(ex, currentFaceSide(ex))}
    ${hintBtn}${hintLine}
    ${flipped?gradeRowHtml():''}
  </div>`;
}
function taskStageHtml(ex, a, b){
  const revealed=S.revealed;
  const at=ex.card.audioTask;
  const canFlip=!ex.card.direction || ex.card.direction==='both';
  let after='';
  if(revealed){
    // варианты вводимой стороны: ru→en (l1l2) — alt2 (alts), en→ru (l2l1) — alt1
    const alts=((ex.dir==='l1l2'?ex.card.alts:ex.card.alt1)||[]);
    const exact=isExact(b, S.typed, alts);
    const diff=diffTokens(b, S.typed).map(x=>`<span class="${x.ok?'diff-ok':'diff-no'}">${esc(x.t)}</span>`).join(' ');
    after=`<div class="answer-box">
        <div class="side-label" style="margin-bottom:.3rem">${esc(t('answer'))}</div>${diff}
        ${alts.length?`<div class="alts">${esc(t('alsoCorrect'))} ${esc(alts.join('; '))}</div>`:''}
        ${exact?`<div class="alts" style="color:var(--ok)">✓ ${esc(t('exact'))}</div>`:''}
      </div>
      <div class="typed-echo">${esc(t('yourAnswer'))} ${esc(S.typed||'—')}</div>
      ${gradeRowHtml()}`;
  }
  const maskLine=(!revealed && S.revealedLetters.size)
    ? `<div class="hintline">${esc(buildMask(b, S.revealedLetters))}</div>`:'';
  const hintText=(!revealed && ex.card.hint)
    ? `<div class="hinttext">${esc(t('hintField'))} ${esc(ex.card.hint)}</div>`:'';
  const promptInner=at
    ? `<div class="audio-big">🎧</div><div class="muted" style="margin-top:8px">${esc(t('listenPrompt'))}</div>`
    : rich(a, ex);
  return `<div class="stage">
    <div class="tapholder small"><div class="side-label">${esc(at?t('audio'):t('prompt'))}</div><div>${promptInner}</div></div>
    ${audioRowHtml(ex, initialFaceSide(ex))}
    ${!revealed?`
      <div style="margin-top:14px"><input type="text" id="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(t('typeHere'))}" value="${esc(S.typed||'')}"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-primary" data-act="reveal">${esc(t('showAnswer'))}</button>
        <button class="btn" data-act="hint">${esc(t('hint'))}</button>
        ${canFlip?`<button class="btn" data-act="flip-dir" title="${esc(t('flipDir'))}">⇄</button>`:''}
      </div>
      ${maskLine}${hintText}
    `:(canFlip?`<div class="row" style="margin-top:10px"><button class="btn btn-sm" data-act="flip-dir">⇄ ${esc(t('flipDir'))}</button></div>`:'')}
    ${after}
    ${revealed?audioRowHtml(ex, currentFaceSide(ex)):''}
  </div>`;
}

    <p>Три шага: создайте текстовый файл колоды → загрузите его на сайт (кнопка «Выбрать файлы») или добавьте ссылкой на GitHub → нажмите «Тренировать». Вот готовый шаблон, который можно скопировать и заменить своим материалом:</p>
    ${codebox(DEMO_DECK)}
    <p>Файл сохраняйте в кодировке UTF-8, расширение — <b>.md</b> или <b>.txt</b> (табличный, см. ниже).</p>`},
  {id:'format', title:'Формат базы', html:`
    <h3>Шапка колоды</h3>
    <p>Необязательный YAML-блок в начале файла задаёт название и языки:</p>
    ${codebox(['---','title: Английский A1 — Урок 1','lang: en        # изучаемый язык','base: ru        # язык переводов','reverse: true   # карточки показывать в обе стороны','description: Описание для себя','---',''].join('\n'))}
    <h3>Один стиль записи</h3>
    <p>Запись — одна строка, поля через <b> | </b>: сторона 1, сторона 2, затем необязательные подсказка и теги. Точка с запятой в первых двух полях перечисляет <b>варианты</b> — первое значение основное, остальные тоже засчитываются; отдельных полей alt1/alt2 не нужно. Литеральные « | » и «;» экранируйте: <code>\\|</code> и <code>\\;</code>. Блочной формы нет — весь файл пишется одинаково.</p>
    ${codebox(['# Карточки','hello | привет','good morning | доброе утро; добрый день','See you tomorrow! | До завтра! | говорится при прощании | приветствия','','# Задания','Привет, как дела?; Здравствуйте, как ты? | Hello! How are you?; Hi! How are you? | неформальное приветствие | приветствия','Меня зовут Ана.; Моё имя — Ана | My name is Ana; I am Ana','tags: знакомство',''].join('\n'))}
    <p>В задании варианты относятся к своей стороне: вводите сторону 2 — засчитываются её текст и варианты; нажали ⇄ и вводите сторону 1 — её текст и варианты. На карточках варианты показаны строкой «Варианты: …», в заданиях после показа ответа — «Тоже верно: …».</p>
    <h3>Секции</h3>
    <p>Заголовок секции определяет, что такое записи под ним; имена — по-русски или по-английски, в любом регистре: <b># Карточки / # Карты / # Card / # Cards</b> — флеш-карты; <b># Задания / # Задание / # Task / # Tasks</b> — задания с вводом ответа; <b># Аудио / # Произношение / # Audio / # Speech</b> — задания на слух (см. «Аудио»). Строки <b>---</b> и пустые строки — визуальные разделители, обычные заголовки (например, названия уроков) разбору не мешают. Если заголовков нет вовсе: строка из двух полей — флеш-карта, из трёх и более — задание.</p>
    <h3>Модификаторы под записью</h3>
    <p>Необязательные поля дописываются строкой-ключом под записью и прикрепляются к ближайшей записи выше: <b>audio:</b>, <b>audio2:</b>, <b>hint:</b>, <b>tags:</b>, <b>id:</b>, <b>direction:</b>, <b>reverse:</b>. Ключи front:, back:, prompt:, answer:, alt1:, alt2: больше не используются — варианты пишутся через «;».</p>
    ${codebox(['# Карточки','Good morning, how are you? | Добрый день, как дела?','hint: формальное приветствие','audio: audio/good-morning.mp3','tags: приветствия',''].join('\n'))}
    <h3>Поля-модификаторы</h3>
    <div class="tablewrap"><table>
      <tr><th>Поле</th><th>Где</th><th>Что делает</th></tr>
      <tr><td>hint</td><td>обе</td><td>текст подсказки (кнопка «Подсказка»)</td></tr>
      <tr><td>audio / audio1</td><td>обе</td><td>озвучка стороны 1 (фронт/prompt); путь или ссылка на mp3/ogg/m4a/wav; несколько полей — плейлист. Нет строки — сайт ищет файл сам: по нумерации или имени (раздел «Аудио»), затем синтез речи</td></tr>
      <tr><td>audio2</td><td>обе</td><td>озвучка стороны 2 (оборот/answer); те же правила автопоиска</td></tr>
      <tr><td>tags</td><td>обе</td><td>теги через запятую — фильтр при старте сессии</td></tr>
      <tr><td>id</td><td>обе</td><td>стабильный идентификатор: прогресс не собьётся при правке текста карточки</td></tr>
      <tr><td>reverse</td><td>карточка</td><td>true — тренировать в обе стороны (по умолчанию из шапки)</td></tr>
      <tr><td>direction</td><td>задание</td><td>l1l2 / l2l1 / both — зафиксировать направление (кнопка ⇄ скрыта)</td></tr>
    </table></div>
    <h3>Правила разбора</h3>
    <p>• Запись — одна строка с « | » (или Tab): 2 поля — основа, 3-е — подсказка, 4-е — теги.<br>• Модификаторы (audio, audio1, audio2, hint, tags, id, direction, reverse) — строки-ключи без « | », прикрепляются к ближайшей записи выше.<br>• «;» разделяет варианты (первое значение — основное); литеральные «;» и « | » экранируйте: <code>\\;</code>, <code>\\|</code>.<br>• Записи нумеруются для автосвязки медиа: карточки отдельно с 01, задания отдельно с 01, аудиозадания отдельно; строки-модификаторы не считаются.<br>• Строки, которые не удалось разобрать, не ломают файл — они попадают в предупреждения на плитке колоды.<br>• Прогресс привязан к тексту карточки: если переписали её текст и хотите сохранить прогресс — добавьте поле <b>id</b>.</p>`},
  {id:'txt', title:'Файлы .txt (таблица)', html:`
    <p>Для массового ввода удобнее TSV: колонки через Tab, строки с <b>#</b> — комментарии. Две колонки — флеш-карта, три колонки (вопрос, ответ, теги) — задание. Такую таблицу легко получить копированием из Excel или Google Sheets.</p>
    ${codebox('# комментарий\nhello\tпривет\ndog\tсобака\n\nПривет, как дела?\tHello! How are you?\tприветствия\n')}`},
  {id:'images', title:'Картинки', html:`
    <p>Картинка вставляется маркдаун-разметкой в любое поле. Три способа:</p>
    ${codebox(['![](img/dog.jpg)                    → файл рядом с колодой в репозитории','![](https://site.com/photo.jpg)   → внешняя ссылка','![](data:image/png;base64,…)      → картинка, вшитая в файл',''].join('\n'))}
    <p>При загрузке по ссылке относительный путь вычисляется от адреса файла колоды (raw.githubusercontent.com отдаёт и файлы, и картинки). При загрузке с устройства нажмите «Выбрать папку» или «Загрузить архив» (.zip): сайт предзагружает все картинки сразу в общую медиа-библиотеку и связывает их по относительному пути, а если точного совпадения нет — по имени файла. Автоподбора «по номеру» у картинок нет, в отличие от аудио: привязка идёт только от явной ссылки в тексте карточки. Библиотека действует до перезагрузки страницы и обслуживает все колоды, включая колоды по ссылке: колода может лежать на GitHub, а картинки — на вашем диске. Картинки, которых нет в библиотеке, не ломают карточку — на их месте появляется тихая пометка «картинка недоступна».</p>
    <p>На карточке картинка показывается в фиксированном размере — не выше ~170 px по высоте, пропорции сохраняются, поэтому огромные фото не ломают вид. Подходят png, jpg, webp, gif (в том числе анимированный), svg и bmp; <b>webm</b> — это видео, а не картинка: если нужна анимация, берите gif.</p>`},
  {id:'audio', title:'Аудио', html:`
    <p><b>audio</b> (полное имя <b>audio1</b>) — озвучка стороны 1: фронт карточки или prompt задания. <b>audio2</b> — озвучка стороны 2: оборот карточки или ответ. При показе стороны звук проигрывается <b>один раз</b> автоматически; повторить — клавиша <b>P</b> или кнопка 🔊 под карточкой. Несколько полей audio — плейлист, кнопки идут по порядку. Пишется модификатором под записью:</p>
    ${codebox(['# Карточки','Hello ; Hi | Привет ; Здравствуйте','audio: audio/Hello_Hi.mp3','audio2: audio/Привет_Здравствуйте.mp3','','![](img/dog.jpg) | Собака','audio2: audio/Собака.mp3',''].join('\n'))}
    <h3>Порядок поиска звука</h3>
    <p>Для каждой стороны карточки или задания сайт ищет звук в этом порядке — первый найденный шаг и работает:</p>
    <p>1. <b>Строки audio: / audio1: / audio2:</b> — ручное указание, главный источник; путь ищется по папке, при промахе — по имени файла.<br>2. <b>Нумерованный файл</b> вида <code>01_Hello_Hi.mp3</code> — номер находит карточку, текст в имени решает, чья это сторона.<br>3. <b>Файл только с номером</b> <code>01.mp3</code> — общая озвучка карточки, играет на обеих сторонах.<br>4. <b>Файл по имени</b>: <code>Hello_Hi.mp3</code> для карточки «Hello ; Hi» (тексты до 6 слов).<br>5. <b>Синтез речи браузера</b> — если включён (см. ниже) и файла нет.</p>
    <h3>Нумерация файлов: аудио почти без строк в файле</h3>
    <p>Записи в файле пронумерованы сами собой: <b>карточки считаются с 01 отдельно, задания — отдельно</b>, аудиозадания секции # Аудио — тоже отдельно. Строки-модификаторы (hint:, tags:, audio:…) не считаются — только записи. Назовите файл <code>01_текст_стороны.mp3</code> — он прикрепится сам:</p>
    ${codebox(['# Карточки','Hello ; Hi ; Hey ; wassup | Здравствуйте ; Привет ; Хай ; Дарова','','01_Hello_Hi_Hey_wassup.mp3             → сторона с английским (номер 01 + текст совпал)','01_Здравствуйте_Привет_Хай_Дарова.mp3 → сторона с русским','01.mp3                                → общая озвучка карточки №01 — играет на обеих сторонах',''].join('\n'))}
    <p>• <b>Номер</b> — цифры до первого подчёркивания: 01, 02, 03… (после 99 — просто 100; <code>1</code> и <code>01</code> равнозначны).<br>• <b>Текст после номера</b> решает, чья это сторона: совпал с английским текстом — озвучка английской стороны, с русским — русской. Поэтому карточки можно писать в любом порядке — <code>English | Русский</code> или <code>Русский | English</code>: привязка идёт к тексту, а не к позиции.<br>• <b>Регистр, подчёркивания и пунктуация не важны</b>: <code>How_are_you</code> найдётся для «How are you?», <code>hello_hi</code> — для «Hello ; Hi». Варианты через «;» тоже участвуют в сравнении.<br>• <b>Сокращённое имя</b> — достаточно начала текста: <code>01_Hello.mp3</code> подойдёт для «Hello ; Hi ; Hey».<br>• Файлы, не нашедшие пару, показываются на плитке колоды строкой «Аудио без пары» — сразу видно, что переименовать (пометка появляется, когда к колоде привязался хотя бы один файл).<br>• У <b>заданий</b> счёт свой: <code>01_Привет_как_дела.mp3</code> — озвучка задания №1. Файл без текста прикрепляется к карточке, поэтому для заданий дописывайте текст в имя.</p>
    <h3>Связка по имени без номера</h3>
    <p>Короткие записи (до 6 слов) находят файл и без номера: карточка «Goodbye ; Bye | Пока ; До свидания» подхватит <code>Goodbye_Bye.mp3</code> и <code>Пока_До_свидания.mp3</code> сама. Длинным предложениям имена из полного текста не нужны — для них нумерация или строки audio:.</p>
    <h3>Секция # Аудио — задания на слух</h3>
    <p>Отдельная секция для заданий «услышь и введи». Запись начинается с <b>audio:</b> или <b>audio2:</b>, после « | » — текст ответа (тоже с вариантами через «;»):</p>
    ${codebox(['# Аудио','audio: audio/Hello_Hi.mp3 | Привет ; Здравствуйте','audio2: audio/Привет_Здравствуйте.mp3 | Hello ; Hi',''].join('\n'))}
    <p>Первая строка: звучит английская озвучка — вводите русский перевод; вторая: звучит русская — вводите английский. Ключ audio:/audio2: лишь помечает, чья это озвучка; задание всегда показывается как 🔊 с полем ввода. Подсказка и теги — как обычно: модификаторами под записью или 3-м и 4-м полями. Направление у аудиозаданий зафиксировано, кнопки ⇄ нет.</p>
    <h3>Как подключить аудио: папка или ZIP</h3>
    <p>Выкладывать mp3 в репозиторий не нужно. Нажмите «Выбрать папку» и укажите папку с колодой и аудио, или загрузите то же содержимое в .zip. Все файлы предзагружаются в медиа-библиотеку: строки audio: ищутся по пути, при промахе — по имени файла (префикс папки не важен: <code>audio/hello.mp3</code> найдётся и как <code>hello.mp3</code>); нумерованные и короткие имена сопоставляются автоматически, как описано выше. Кириллица в именах файлов работает и в папке, и внутри ZIP: кодировка архива определяется сама (UTF-8, cp1251, cp866, koi8-r), имена из старых виндовых архивов читаются правильно. В тосте после загрузки архива показаны первые имена файлов — кодировку видно сразу, а не по звуку. Файлы, которых нет среди подключённых, помечаются тихо — тост «Аудио недоступно: путь» показывается один раз.</p>
    <h3>Синтез речи, громкость, выключение звука</h3>
    <p>Если у стороны нет своего аудио, текст может прочитать <b>встроенный синтез речи браузера</b> — бесплатно и без единого файла, удобно для предложений, которые лень озвучивать вручную. Язык голоса берётся из шапки колоды (lang и base), а если она не заполнена — определяется по алфавиту текста. Синтез включается кнопкой 🗣 — она есть на главной в «Настройках» и в сессии рядом с размером шрифта; состояние общее и запоминается. Рядом — <b>Громкость</b> (слайдер, запоминается; по умолчанию 70%) и кнопка 🔊/🔇 полного выключения звука: она глушит и файлы, и синтез. Кнопка 🔊 под карточкой при отсутствии файла тоже читает текст синтезом; клавиша P повторяет текущую сторону.</p>
    <h3>Как сделать свои аудио</h3>
    <p><b>edge-tts</b> — рекомендуемый способ: бесплатно, нейроголоса Microsoft, десятки языков. Установите Python, затем в терминале:</p>
    ${codebox(['pip install edge-tts','','edge-tts --voice en-US-AriaNeural --text "Good morning, how are you?" --write-media 01_Good_morning_how_are_you.mp3',''].join('\n'))}
    <div class="tablewrap"><table>
      <tr><th>Язык</th><th>Голоса</th></tr>
      <tr><td>Английский</td><td>en-US-AriaNeural, en-GB-SoniaNeural, en-US-GuyNeural</td></tr>
      <tr><td>Русский</td><td>ru-RU-SvetlanaNeural, ru-RU-DmitryNeural</td></tr>
      <tr><td>Французский</td><td>fr-FR-DeniseNeural, fr-FR-HenriNeural</td></tr>
      <tr><td>Немецкий</td><td>de-DE-KatjaNeural, de-DE-ConradNeural</td></tr>
      <tr><td>Испанский</td><td>es-ES-ElviraNeural, es-MX-DaliaNeural</td></tr>
    </table></div>
    <p>Полный список голосов: команда <b>edge-tts --list-voices</b>. Альтернативы: <b>gTTS</b> (простые голоса Google, короткий Python-скрипт), <b>Piper</b> (локальный синтез без интернета), <b>Forvo</b> (живые записи носителей для отдельных слов), платные сервисы максимального качества (Azure TTS, ElevenLabs, OpenAI TTS) и обычная запись голоса на телефоне. Файлы удобно складывать в папку рядом с колодой; при локальной работе имена могут быть любыми — латиница без пробелов нужна только если планируете выкладывать файлы в репозиторий.</p>`},
  {id:'loading', title:'Загрузка на сайт', html:`
    <p><b>Рекомендованные</b> — колоды, вшитые в сайт автором. <b>Ссылка</b> — raw-адрес файла на GitHub: сайт скачивает его и запоминает в браузере, дальше работает даже оффлайн; кнопка «Обновить» подтягивает правки. <b>Файлы с устройства</b> — три кнопки: «Выбрать файлы» (колоды .md/.txt вместе с медиа рядом, или сразу .zip), «Выбрать папку» (целая папка — колоды и медиа найдутся сами), «Загрузить архив» (.zip: колоды внутри импортируются, аудио и картинки распаковываются в память). Всё медиа предзагружается в общую медиа-библиотеку — до перезагрузки страницы оно обслуживает все колоды, включая колоды по ссылке: тексты колод могут лежать на GitHub, а аудио и картинки — на вашем диске. Состояние библиотеки видно на главной в панели «Медиа-библиотека», кнопка «Отключить» освобождает память. Тексты колод сохраняются в браузере (localStorage).</p>
    <p>Чтобы выложить свои колоды на GitHub: создайте репозиторий, положите туда decks/urok1.md, откройте файл на github.com и нажмите Raw — этот адрес и добавляйте на сайт. Хранилище браузера — около 5 МБ, текстовых колод хватит на сотни уроков. Весь ваш прогресс можно перенести между компьютером и телефоном экспортом/импортом JSON-файла (раздел «Настройки»).</p>`},
  {id:'progress', title:'Прогресс', html:`
    <p>По каждой карточке сайт помнит счётчики «знал / не знал», дату последнего показа и число подсказок. На плитке колоды видна сводка. В начале сессии можно выбрать «Повторить только ошибки» — тогда пойдут лишь карточки с ошибками. Кнопка сброса удаляет весь прогресс (осторожно: восстановить нельзя, заранее сделайте экспорт).</p>`},
  {id:'keys', title:'Горячие клавиши', html:`
    <div class="tablewrap"><table>
      <tr><th>Клавиша</th><th>Действие</th></tr>
      <tr><td>Пробел / Enter</td><td>перевернуть карточку или показать ответ</td></tr>
      <tr><td>1</td><td>Знал</td></tr>
      <tr><td>2</td><td>Не знал</td></tr>
      <tr><td>H</td><td>Подсказка (в заданиях открывает случайные буквы)</td></tr>
      <tr><td>P</td><td>Повторить аудио текущей стороны</td></tr>
      <tr><td>F</td><td>Сменить направление задания (⇄)</td></tr>
      <tr><td>Esc</td><td>Выйти из сессии</td></tr>
    </table></div>
    <p>Клавиши привязаны к физическим кнопкам клавиатуры и работают на любой раскладке: на русской раскладке те же клавиши делают то же самое. На телефоне карточка переворачивается тапом по всей её площади.</p>`},
  {id:'faq', title:'Вопросы и ответы', html:`
    <p><b>Почему у локальной колоды пропали картинки после перезагрузки?</b> Медиа живут до перезагрузки страницы; текст сохраняется. Нажмите «Выбрать папку» или «Загрузить архив» ещё раз — подключение занимает пару секунд.</p>
    <p><b>Прогресс карточки сбросился после правки её текста.</b> Прогресс привязан к тексту — добавьте карточке поле id и меняйте текст свободно.</p>
    <p><b>Ссылка не добавляется.</b> Файл должен быть публично доступен (публичный репозиторий GitHub) и существовать по адресу; проверьте ссылку в браузере.</p>
    <p><b>Задание спрашивает не в ту сторону.</b> Нажмите ⇄ в сессии или задайте direction в файле.</p>
    <p><b>Аудио не играет само.</b> Браузеры разрешают звук только после первого взаимодействия со страницей — кликните или нажмите любую клавишу, дальше автопроигрывание будет работать на каждой карточке. Повтор текущей стороны — клавиша P.</p>
    <p><b>«Аудио недоступно: audio/…».</b> Этого файла нет среди подключённого медиа и автосвязка не нашла пару. Нажмите «Выбрать папку» (папка с колодой и аудио целиком) или «Загрузите архив» (.zip). Либо переименуйте файлы в нумерованный вид <code>01_Hello_Hi.mp3</code> — сайт свяжет их сам; непарные файлы видны на плитке колоды строкой «Аудио без пары». Для колоды по ссылке выкладывать mp3 в репозиторий не обязательно: подключите их локально, они подхватятся.</p>
    <p><b>Какой ZIP подойдёт?</b> Обычный .zip от любого архиватора (методы «без сжатия» и deflate); вложенные папки поддерживаются. Кириллица в именах читается правильно: кодировка определяется автоматически (UTF-8 и виндовые cp1251/cp866/koi8-r), в тосте после загрузки видны первые имена файлов. Зашифрованные архивы не читаются. Колоды .md/.txt внутри архива добавляются сами, аудио и картинки попадают в медиа-библиотеку.</p>
    <p><b>Синтез речи молчит или читает не тем языком.</b> Проверьте, что включён 🗣 (на главной или в сессии) и звук не выключен (🔇). Голос зависит от браузера: свежие Chrome и Edge умеют русский и английский лучше всего. Язык берётся из шапки колоды — заполните lang (изучаемый) и base (родной), если синтез путает языки. Синтез — запаска: свой mp3 всегда звучит вместо него.</p>
    <p><b>Внутри текста есть «;» или « | ».</b> «;» разделяет варианты, « | » — поля. Литеральные символы экранируйте: <code>\\;</code> и <code>\\|</code> — строка «Раз\\; два | Один» станет карточкой с текстом «Раз; два».</p>`}
  ];
