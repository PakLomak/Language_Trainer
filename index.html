function instrSectionsEn(){
  return [
  {id:'start', title:'Quick start', html:`
    <p>Three steps: create a deck text file → upload it (the "Choose files" button) or add a GitHub link → press "Train". Here is a full template you can copy and edit:</p>
    ${codebox(DEMO_DECK)}
    <p>Save files in UTF-8 as <b>.md</b> or <b>.txt</b> (table form, see below).</p>`},
  {id:'format', title:'Deck format', html:`
    <h3>Deck header</h3>
    <p>An optional YAML block at the top sets the title and languages:</p>
    ${codebox(['---','title: English A1 — Lesson 1','lang: en        # target language','base: ru        # translation language','reverse: true   # show cards in both directions','---',''].join('\n'))}
    <h3>One style of writing</h3>
    <p>A record is one line with fields separated by <b> | </b>: side 1, side 2, then optional hint and tags. A semicolon in the first two fields lists <b>alternatives</b> — the first value is the main text, the rest are also accepted; no separate alt1/alt2 fields are needed. Escape literal " | " and ";" as <code>\\|</code> and <code>\\;</code>. There is no block form — the whole file is written the same way.</p>
    ${codebox(['# Карточки','hello | привет','good morning | доброе утро; добрый день','See you tomorrow! | До завтра! | said when parting | greetings','','# Задания','Привет, как дела?; Здравствуйте, как ты? | Hello! How are you?; Hi! How are you? | informal greeting | greetings','Меня зовут Ана.; Моё имя — Ана | My name is Ana; I am Ana','tags: greetings',''].join('\n'))}
    <p>Alternatives belong to their side: typing side 2 accepts its text and alternatives; press ⇄ to type side 1 — its text and alternatives are accepted. On flashcards alternatives are shown as "Variants: …", in tasks as "Also correct: …".</p>
    <h3>Sections</h3>
    <p>The section heading says what the records below are; names work in Russian or English, any case: <b># Карточки / # Карты / # Card / # Cards</b> — flashcards; <b># Задания / # Задание / # Task / # Tasks</b> — typing tasks; <b># Аудио / # Произношение / # Audio / # Speech</b> — listening tasks (see "Audio"). Lines of <b>---</b> and blank lines are optional visual separators; ordinary headings do not affect parsing. Without section headings: a two-field line is a flashcard, three or more fields make a task.</p>
    <h3>Modifiers under a record</h3>
    <p>Optional fields are written as key lines under a record and attach to the nearest record above: <b>audio:</b>, <b>audio2:</b>, <b>hint:</b>, <b>tags:</b>, <b>id:</b>, <b>direction:</b>, <b>reverse:</b>. The keys front:, back:, prompt:, answer:, alt1:, alt2: are no longer used — alternatives are written with ";".</p>
    ${codebox(['# Карточки','Good morning, how are you? | Добрый день, как дела?','hint: formal greeting','audio: audio/good-morning.mp3','tags: greetings',''].join('\n'))}
    <h3>Modifier fields</h3>
    <div class="tablewrap"><table>
      <tr><th>Field</th><th>Applies to</th><th>Meaning</th></tr>
      <tr><td>hint</td><td>both</td><td>hint text</td></tr>
      <tr><td>audio / audio1</td><td>both</td><td>side-1 audio (front/prompt); path or URL (mp3/ogg/m4a/wav); repeat for a playlist. No line — the site searches by itself: numbering or name (see "Audio"), then speech synthesis</td></tr>
      <tr><td>audio2</td><td>both</td><td>side-2 audio (back/answer); the same auto-matching rules</td></tr>
      <tr><td>tags</td><td>both</td><td>comma-separated tags for session filters</td></tr>
      <tr><td>id</td><td>both</td><td>stable id: keeps progress when text is edited</td></tr>
      <tr><td>reverse</td><td>card</td><td>true — train both directions</td></tr>
      <tr><td>direction</td><td>task</td><td>l1l2 / l2l1 / both — fix the direction (⇄ hidden)</td></tr>
    </table></div>
    <h3>Parsing rules</h3>
    <p>• A record is a single line with " | " (or Tab): 2 fields are the sides, the 3rd is the hint, the 4th is tags.<br>• Modifiers (audio, audio1, audio2, hint, tags, id, direction, reverse) are key lines without " | " attaching to the nearest record above.<br>• ";" splits alternatives (first value is the main one); escape literal ";" and " | " as <code>\\;</code> and <code>\\|</code>.<br>• Records are numbered for media auto-matching: cards from 01 separately, tasks from 01 separately, listening tasks separately; modifier lines do not count.<br>• Lines that cannot be parsed do not break the file — they are reported as warnings on the deck tile.<br>• Progress is tied to card text — add an <b>id</b> field to keep it after edits.</p>`},
  {id:'txt', title:'Plain .txt (TSV)', html:`
    <p>For bulk entry use TSV: Tab-separated columns, lines starting with <b>#</b> are comments. Two columns make a flashcard, three columns (prompt, answer, tags) make a task. Paste straight from Excel or Google Sheets.</p>
    ${codebox('hello\tпривет\ndog\tсобака\n\nПривет, как дела?\tHello! How are you?\tgreetings\n')}`},
  {id:'images', title:'Images', html:`
    <p>Images use markdown syntax in any field. Three ways:</p>
    ${codebox(['![](img/dog.jpg)                    → file next to the deck in the repo','![](https://site.com/photo.jpg)   → external URL','![](data:image/png;base64,…)      → embedded image',''].join('\n'))}
    <p>For link-based decks relative paths resolve against the deck file URL. For device uploads press "Choose folder" or "Load archive" (.zip): the site preloads every image into the shared media library and matches them by relative path first, then by file name. Unlike audio, images have no number-based matching: they attach only from an explicit link in the card text. The library lasts until the page is reloaded and serves every deck, link-based decks included: the deck can live on GitHub while images stay on your disk. Images missing from the library do not break the card — a quiet "image unavailable" mark takes their place.</p>
    <p>On a card an image is shown at a fixed size — at most ~170 px tall, proportions kept, so huge photos do not break the layout. png, jpg, webp, gif (including animated), svg and bmp all work; <b>webm</b> is a video, not an image — use gif for animation.</p>`},
  {id:'audio', title:'Audio', html:`
    <p><b>audio</b> (full name <b>audio1</b>) is the side-1 sound: the front of a card or the prompt of a task. <b>audio2</b> is side 2: the back of a card or the answer. When a side with audio is shown, the sound plays <b>once</b> automatically; press <b>P</b> or the 🔊 button to replay. Several audio fields make a playlist with buttons in order. Written as a modifier line under a record:</p>
    ${codebox(['# Карточки','Hello ; Hi | Привет ; Здравствуйте','audio: audio/Hello_Hi.mp3','audio2: audio/Привет_Здравствуйте.mp3','','![](img/dog.jpg) | Собака','audio2: audio/Собака.mp3',''].join('\n'))}
    <h3>How sound is found</h3>
    <p>For every side of a card or task the site searches in this order — the first hit wins:</p>
    <p>1. <b>audio: / audio1: / audio2: lines</b> — manual, always the main source; the path is matched by folder first, then by file name.<br>2. <b>Numbered file</b> like <code>01_Hello_Hi.mp3</code> — the number finds the card, the text in the name decides which side it belongs to.<br>3. <b>Number-only file</b> <code>01.mp3</code> — the card's shared audio, plays on both sides.<br>4. <b>File by name</b>: <code>Hello_Hi.mp3</code> for the card "Hello ; Hi" (texts up to 6 words).<br>5. <b>Browser speech synthesis</b> — if enabled (see below) and no file exists.</p>
    <h3>Numbered files: audio with almost no lines in the deck</h3>
    <p>Records are numbered automatically: <b>cards count from 01 separately, tasks separately</b>, listening tasks of the # Audio section separately. Modifier lines (hint:, tags:, audio:…) do not count — only records. Name a file <code>01_side_text.mp3</code> and it attaches itself:</p>
    ${codebox(['# Карточки','Hello ; Hi ; Hey ; wassup | Здравствуйте ; Привет ; Хай ; Дарова','','01_Hello_Hi_Hey_wassup.mp3             → the English side (number 01 + text matched)','01_Здравствуйте_Привет_Хай_Дарова.mp3 → the Russian side','01.mp3                                → shared audio of card #01 — plays on both sides',''].join('\n'))}
    <p>• <b>The number</b> is the digits before the first underscore: 01, 02, 03… (after 99 just 100; <code>1</code> and <code>01</code> are the same).<br>• <b>The text after the number</b> decides the side: matched the English text — it is the English side's audio; matched the Russian text — the Russian side. Cards can be written in any order — <code>English | Русский</code> or <code>Русский | English</code>: files attach to text, not position.<br>• <b>Case, underscores and punctuation do not matter</b>: <code>How_are_you</code> matches "How are you?", <code>hello_hi</code> matches "Hello ; Hi". ";" alternatives take part in the comparison too.<br>• <b>Shortened name</b> — the beginning of the text is enough: <code>01_Hello.mp3</code> works for "Hello ; Hi ; Hey".<br>• Files that found no pair are listed on the deck tile as "Unmatched audio" — you see right away what to rename (the note appears once at least one file has matched the deck).<br>• <b>Tasks</b> count separately: <code>01_Привет_как_дела.mp3</code> is task #1's audio. A number-only file attaches to a card, so for tasks keep the text in the name.</p>
    <h3>Matching by name without a number</h3>
    <p>Short records (up to 6 words) find their file even without a number: the card "Goodbye ; Bye | Пока ; До свидания" picks up <code>Goodbye_Bye.mp3</code> and <code>Пока_До_свидания.mp3</code> on its own. Long sentences do not need full-text names — use numbering or audio: lines.</p>
    <h3>The # Audio section — listening tasks</h3>
    <p>A separate section for "hear and type" tasks. A record starts with <b>audio:</b> or <b>audio2:</b>; after " | " comes the answer text (also with ";" alternatives):</p>
    ${codebox(['# Аудио','audio: audio/Hello_Hi.mp3 | Привет ; Здравствуйте','audio2: audio/Привет_Здравствуйте.mp3 | Hello ; Hi',''].join('\n'))}
    <p>The first line: English audio plays — type the Russian translation; the second: Russian audio — type English. The audio:/audio2: key only marks whose voice it is; the task is always shown as 🔊 with an input field. Hint and tags work as usual: modifiers under the record or the 3rd and 4th fields. Listening tasks have a fixed direction and no ⇄ button.</p>
    <h3>Connecting audio: folder or ZIP</h3>
    <p>There is no need to upload mp3 files to a repository. Press "Choose folder" and pick the folder with the deck and audio, or load the same content as a .zip. All files are preloaded into the media library: audio: paths are matched by path first, then by file name (the folder prefix does not matter: <code>audio/hello.mp3</code> is also found as <code>hello.mp3</code>); numbered and short names are matched automatically as described above. Cyrillic file names work in a folder and inside a ZIP: the archive encoding is detected automatically (UTF-8 and the Windows cp1251/cp866/koi8-r), names from old Windows archives read correctly. The toast after loading a zip shows the first file names — you see the encoding right away, not by ear. Files that are not connected are marked quietly — the "Audio unavailable: path" toast appears once.</p>
    <h3>Speech synthesis, volume, mute</h3>
    <p>When a side has no audio of its own, the <b>built-in browser speech synthesis</b> can read the text — free, no files at all, handy for sentences you do not want to record. The voice language comes from the deck header (lang and base), or is detected from the text alphabet. Toggle it with the 🗣 button — on the home screen in Settings and in a session next to the font size; the state is shared and remembered. Next to it: <b>Volume</b> (a slider, remembered; 70% by default) and the 🔊/🔇 mute button that silences both files and synthesis. The 🔊 button under a card reads the text with synthesis when no file exists; press P to replay the current side.</p>
    <h3>Making your own audio</h3>
    <p>Recommended free generator — <b>edge-tts</b> (Microsoft neural voices):</p>
    ${codebox(['pip install edge-tts','','edge-tts --voice en-US-AriaNeural --text "Good morning, how are you?" --write-media 01_Good_morning_how_are_you.mp3',''].join('\n'))}
    <p>Alternatives: gTTS (simple Google voices), Piper (offline), Forvo (human recordings of single words), paid services (Azure TTS, ElevenLabs, OpenAI TTS), or a phone voice recorder. Keep files in a folder next to the deck; for local use names can be anything — Latin letters without spaces matter only if you plan to push the files into a repository.</p>`},
  {id:'loading', title:'Loading decks', html:`
    <p><b>Built-in</b> decks ship with the site. <b>Links</b> — raw GitHub URLs: the site downloads and caches them in the browser, so they work offline; "Refresh" pulls edits. <b>Device files</b> — three buttons: "Choose files" (.md/.txt decks together with nearby media, or a .zip right away), "Choose folder" (a whole folder — decks and media are found for you), "Load archive" (.zip: decks inside are imported, audio and images are unpacked into memory). All media is preloaded into the shared media library — until the page is reloaded it serves every deck, link-based decks included: deck texts can live on GitHub while audio and images stay on your disk. The library state is visible on the home screen in the "Media library" panel; the "Disconnect media" button frees the memory. Deck text is stored in the browser (localStorage). Browser storage is about 5 MB. Move progress between devices with the JSON export/import in Settings.</p>`},
  {id:'progress', title:'Progress', html:`
    <p>Per card the site keeps knew/missed counters, last-seen date and hint count. Session setup offers "Repeat mistakes only". The reset button wipes all progress — export first, it cannot be undone.</p>`},
  {id:'keys', title:'Keyboard', html:`
    <div class="tablewrap"><table>
      <tr><th>Key</th><th>Action</th></tr>
      <tr><td>Space / Enter</td><td>flip card or reveal answer</td></tr>
      <tr><td>1 / 2</td><td>knew / missed</td></tr>
      <tr><td>H</td><td>hint (reveals random letters)</td></tr>
      <tr><td>P</td><td>replay audio of the current side</td></tr>
      <tr><td>F</td><td>flip task direction (⇄)</td></tr>
      <tr><td>Esc</td><td>exit session</td></tr>
    </table></div>
    <p>Keys are bound to physical keyboard buttons and work on any keyboard layout: with a Russian layout selected the same keys do the same thing. On phones a card flips by tapping anywhere on it.</p>`},
  {id:'faq', title:'FAQ', html:`
    <p><b>Images of a local deck disappeared after reload.</b> Media lasts until the page is reloaded; the text is kept. Press "Choose folder" or "Load archive" again — reconnecting takes a couple of seconds.</p>
    <p><b>Progress reset after editing a card.</b> Progress is tied to text — add an id field.</p>
    <p><b>A link is not added.</b> The file must be publicly accessible; open the URL in a browser to verify.</p>
    <p><b>A task asks in the wrong direction.</b> Press ⇄ or set direction in the file.</p>
    <p><b>Audio does not play by itself.</b> Browsers allow sound only after the first interaction with the page — click or press any key once, then autoplay works on every card. Press P to replay the current side.</p>
    <p><b>"Audio unavailable: audio/…".</b> This file is not among the connected media and auto-matching found no pair. Press "Choose folder" (the whole folder with the deck and audio) or load a .zip. Or rename your files to the numbered form <code>01_Hello_Hi.mp3</code> — the site will link them itself; unmatched files are listed on the deck tile as "Unmatched audio". For a link-based deck you do not have to push mp3 files into the repository: connect them locally and they will be picked up.</p>
    <p><b>Which ZIP works?</b> A regular .zip from any archiver (stored or deflate methods); nested folders are supported. Cyrillic names read correctly: the encoding is detected automatically (UTF-8 and the Windows cp1251/cp866/koi8-r), and the toast after loading shows the first file names. Encrypted archives are not read. .md/.txt decks inside the archive are added automatically; audio and images go to the media library.</p>
    <p><b>Speech synthesis is silent or uses the wrong language.</b> Check that 🗣 is on (home screen or session) and sound is not muted (🔇). The voice depends on the browser: fresh Chrome and Edge handle English and Russian best. The language comes from the deck header — fill in lang (target) and base (native) if synthesis mixes languages. Synthesis is a fallback: the card's own mp3 always plays instead of it.</p>
    <p><b>The text contains ";" or " | ".</b> ";" splits alternatives, " | " separates fields. Escape literal characters: <code>\\;</code> and <code>\\|</code> — the line "Раз\\; два | Один" becomes a card with the text "Раз; два".</p>`}
  ];

function instructionView(){

/* ============================ actions ============================ */
async function onFilesChosen(fileList){
  const files=[...fileList];
  if(pendingReupload){
    const id=pendingReupload; pendingReupload=null;
    const f=files.find(x=>/\.(md|markdown|txt)$/i.test(x.name));
    if(!f){ toast(t('invalidFile')); rerender(); return; }
    const text=await f.text();
    const deck=parseDeck(text, f.name);
    if(!deck.cards.length){ toast(t('parseEmpty')); rerender(); return; }
    const m=deckMetas.find(x=>x.id===id);
    if(m){ m.text=text; m.name=deck.title; m.savedAt=nowIso(); delete m.error; saveDecks(); toast(t('updated')); }
    registerAssets(id, files);
    registerMediaLib(files);
    rerender();
    return;
  }
  registerMediaLib(files);
  let added=0, zips=0; const failed=[];
  // cohort мультивыбора: те же файлы, выбранные повторно, дают тот же id (fnv по путям)
  const selId='sel:'+fnv(files.map(f=>f.webkitRelativePath||f.name).sort().join('|'));
  for(const f of files){
    try{
      if(f.name.startsWith('.')) continue;
      if(/\.zip$/i.test(f.name)){ zips++; await importZip(f); continue; }
      if(/\.(md|markdown|txt)$/i.test(f.name)){
        const text=await f.text();
        const deck=parseDeck(text, f.name);
        if(!deck.cards.length){ toast(t('parseEmpty')+': '+f.name); continue; }
        const id=deckIdForLocal(deck.title);
        addDeckFromText(text, f.name, 'local', null, rootCohortOf(f)||selId);
        registerAssets(id, files);
        added++;
      }
    }catch(e){ failed.push(f.name+' — '+(e && e.message ? e.message : 'ошибка')); }
  }
  if(!added && !zips){ toast(failed.length?t('invalidFile')+' ('+failed[0]+')':t('invalidFile')); }
  else if(added){ toast(added+' × '+t('added')+(failed.length?' · ⚠ '+failed.length+' '+(LANG==='ru'?'файлов с ошибкой':'failed')+': '+failed[0]:'')); }
  rerender(); // медиа-библиотека видна сразу, даже если разбор колод не удался
}
function registerAssets(deckId, files){
  const map={};
  for(const f of files){
    if(f.name.startsWith('.')) continue;
    if(/\.(md|markdown|txt|json)$/i.test(f.name)) continue;
    if(!/^(image|audio)\//.test(f.type||'')) continue;
    const url=URL.createObjectURL(f);
    if(f.webkitRelativePath){
      const rp=f.webkitRelativePath.replace(/^\.\//,'');
      map[rp]=url;
      const noRoot=rp.indexOf('/')>=0 ? rp.slice(rp.indexOf('/')+1) : '';
      if(noRoot) map[noRoot]=url;
    }
    map[f.name]=url;
    map[f.name.toLowerCase()]=url;
  }
  if(Object.keys(map).length) localAssets[deckId]=map;
}

/* ============================ zip ============================ */
// Чтение ZIP без внешних библиотек. Имена записей берутся из центрального каталога,
// записи «без сжатия» (метод 0) берутся как есть, deflate (метод 8) распаковывается
// штатным DecompressionStream('deflate-raw'). Зашифрованные записи и ZIP64 не поддерживаются.
// доля «настоящей» кириллицы в строке; бонус за строчные — русские имена файлов почти всегда со строчными
function cyrScore(s){
  let cyr=0, low=0;
  for(const ch of String(s)){
    const c=ch.codePointAt(0);
    if((c>=0x0410&&c<=0x044F)||c===0x0451||c===0x0401){ cyr++; if(c>=0x0430||c===0x0451) low++; }
  }
  return cyr/Math.max(1,String(s).length) + 0.15*(low/Math.max(1,String(s).length));
}
function decodeZipName(bytes, flags){
  if(flags & 0x0800) return new TextDecoder('utf-8').decode(bytes); // имя помечено как UTF-8
  const cands=[];
  const tryDec=enc=>{ try{ return new TextDecoder(enc,{fatal:true}).decode(bytes); }catch(e){ return null; } };
  const u8=tryDec('utf-8'); if(u8!=null) cands.push(u8);
  // без UTF-8-метки архиваторы под Windows пишут имена в системной однобайтовой кодировке;
  // байты одной кодировки «успешно» читаются другой, поэтому кандидатов оцениваем по кириллице
  for(const enc of ['windows-1251','ibm866','koi8-r']){
    const s=tryDec(enc); if(s!=null) cands.push(s);
  }
  if(!cands.length) return new TextDecoder('utf-8').decode(bytes);
  let best=cands[0], bestScore=-1;
  for(const s of cands){ const sc=cyrScore(s); if(sc>bestScore){ bestScore=sc; best=s; } }
  return best;
}
async function unzipEntry(u8, dv, en){
  if(dv.getUint32(en.off,true)!==0x04034b50) throw new Error('bad local header');
  const nLen=dv.getUint16(en.off+26,true), eLen=dv.getUint16(en.off+28,true);
  const start=en.off+30+nLen+eLen;
  if(start+en.size>u8.length) throw new Error('truncated');
  const comp=u8.subarray(start, start+en.size);
  if(en.method===0) return new Blob([comp], {type:mimeFor(en.name)});
  const ds=new DecompressionStream('deflate-raw');
  const blob=await new Response(new Blob([comp]).stream().pipeThrough(ds)).blob();
  return blob.slice(0, blob.size, mimeFor(en.name) || blob.type);
}
async function readZip(file){
  const buf=await file.arrayBuffer();
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let eocd=-1;
  const from=Math.max(0, u8.length-65557);
  for(let p=u8.length-22; p>=from; p--){
    if(dv.getUint32(p,true)===0x06054b50){ eocd=p; break; }
  }
  if(eocd<0) throw new Error('not a zip');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  if(off===0xFFFFFFFF || off+46>u8.length) throw new Error('zip64 unsupported');
  const entries=[];
  for(let n=0; n<count; n++){
    if(off+46>u8.length || dv.getUint32(off,true)!==0x02014b50) break;
    const flags=dv.getUint16(off+8,true);
    const method=dv.getUint16(off+10,true);
    const size=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), cmtLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=decodeZipName(u8.subarray(off+46, off+46+nameLen), flags);
    if(!(flags&1) && size!==0xFFFFFFFF && lho!==0xFFFFFFFF && !name.endsWith('/')) entries.push({name, method, size, off:lho});
    off+=46+nameLen+extraLen+cmtLen;
  }
  const out=[];
  for(const en of entries){
    if(en.off+30>u8.length || dv.getUint32(en.off,true)!==0x04034b50) continue;
    try{ out.push({name:en.name, blob:await unzipEntry(u8, dv, en)}); }catch(e){ if(e && e.message==='zip64 unsupported') throw e; }
  }
  return out;
}
let zipBusy=false;
async function importZip(file){
  if(zipBusy) return;
  zipBusy=true;
  toast(t('zipImporting'));
  try{
    if(!('DecompressionStream' in window)){ toast(t('zipUnsupported')); return; }
    const entries=await readZip(file);
    const zipCohort=(file.name||'').replace(/\.zip$/i,''); // файлы архива — cohort имени zip
    const media=[], decks=[];
    for(const en of entries){
      const name=en.name.replace(/^\.?\//,'');
      const base=name.split('/').pop()||name;
      if(name.startsWith('__MACOSX/') || base.startsWith('._')) continue; // мусор macOS-архивов
      if(/\.(md|markdown|txt)$/i.test(base)) decks.push({name:base, text:await en.blob.text()});
      else if(isMediaFile(base, en.blob.type)) media.push({name, blob:en.blob});
    }
    for(const m of media){
      const url=URL.createObjectURL(m.blob);
      putMediaKey(mediaLib.files, m.name, url);
      putMediaKey(mediaLib.files, m.name.split('/').pop()||m.name, url);
      mediaLib.items.push({path:m.name, url, cohort:zipCohort});
    }
    const [a,i]=mediaCount(media);
    mediaLib.audio+=a; mediaLib.image+=i;
    mediaRev++;
    let added=0; const failed=[];
    for(const d of decks){
      try{
        const deck=parseDeck(d.text, d.name);
        if(!deck.cards.length) continue;
        addDeckFromText(d.text, d.name, 'local', null, zipCohort);
        added++;
      }catch(e){ failed.push(d.name+' — '+(e && e.message ? e.message : 'ошибка')); }
    }
    if(!media.length && !added){ toast(failed.length?t('zipFail')+': '+failed.join('; '):t('zipEmpty')); return; }
    const parts=[];
    if(media.length) parts.push(media.length+' '+(LANG==='ru'?'медиа':'media')+' ('+a+' '+t('mediaAudio')+' · '+i+' '+imgWord(i)+')');
    if(added) parts.push(added+' '+(LANG==='ru'?plural(added,'колода','колоды','колод'):(added===1?'deck':'decks')));
    // пара первых имён — чтобы кодировку видно было сразу, а не по звуку
    const sample=media.slice(0,2).map(m=>m.name.split('/').pop()).join(', ');
    if(sample) parts.push('«'+sample+(media.length>2?'…':'')+'»');
    if(failed.length) parts.push('⚠ '+failed.length+' '+(LANG==='ru'?'колод не прочитано':'decks failed')+': '+failed[0]);
    toast(t('zipImported')+': '+parts.join(', '), 5000);
  }catch(e){
    toast(t('zipFail')+(e && e.message ? ': '+e.message : ''));
  }finally{
    zipBusy=false;
    rerender(); // медиа-библиотека обновляется на экране даже при частичной ошибке
  }
}
const act={
  'set-lang':arg=>{ settings.lang=arg; LANG=arg; saveSettings(); rerender(); },
  'open-setup':arg=>{
    const ids=arg==='all'?deckMetas.map(m=>m.id):[arg];
    pendingSetup={ ids, mode:'mix', direction:'mixed', onlyMistakes:false, tags:[], size:'' };
    rerender();
  },
  'setup-set':(arg,el)=>{
    if(el.dataset.kind==='mode') pendingSetup.mode=arg;
    else pendingSetup.direction=arg;
    rerender();
  },
  'tag':arg=>{
    const i=pendingSetup.tags.indexOf(arg);
    if(i>=0) pendingSetup.tags.splice(i,1); else pendingSetup.tags.push(arg);
    rerender();
  },
  'onlymistakes':()=>{ pendingSetup.onlyMistakes=!pendingSetup.onlyMistakes; rerender(); },
  'setup-start':()=>{
    const sizeEl=document.getElementById('size-input');
    const size=sizeEl&&sizeEl.value?Math.max(1,parseInt(sizeEl.value,10)||0):0;
    const cfg={ deckIds:pendingSetup.ids, mode:pendingSetup.mode, direction:pendingSetup.direction,
                onlyMistakes:pendingSetup.onlyMistakes, tags:pendingSetup.tags.slice(), size };
    pendingSetup=null;
    startSession(cfg);
    rerender();
  },
  'setup-cancel':()=>{ pendingSetup=null; rerender(); },
  'overlay-close':(arg,el,e)=>{ if(e.target===el){ pendingSetup=null; rerender(); } },
  'add-url':()=>{
    const inp=document.getElementById('url-input');
    const url=inp?inp.value.trim():'';
    if(!url){ toast(t('noUrl')); return; }
    addUrl(url);
  },
  'upload':()=>{ document.getElementById('file-input').click(); },
  'upload-folder':()=>{ const el=document.getElementById('folder-input'); if(el) el.click(); },
  'upload-zip':()=>{ const el=document.getElementById('zip-input'); if(el) el.click(); },
  'clear-media':()=>{ clearMediaLib(); toast(t('mediaCleared')); rerender(); },
  'toggle-mute':()=>{ settings.muted=!settings.muted; if(settings.muted) stopSpeech(); saveSettings(); rerender(); },
  'toggle-tts':()=>{ settings.tts=!settings.tts; if(!settings.tts) stopSpeech(); saveSettings(); rerender(); },
  'speak':arg=>{ if(!S||S.done) return; speakSide(cur(), arg==='2'?'2':'1'); },
  'reupload':arg=>{ pendingReupload=arg; document.getElementById('file-input').click(); },
  'refresh':arg=>{ fetchDeckText(arg, false); },
  'delete':arg=>{
    if(!confirm(t('confirmDelete'))) return;
    deckMetas=deckMetas.filter(d=>d.id!==arg);
    saveDecks(); rerender();
  },
  'restore-demo':()=>{
    if(!deckMetas.some(d=>d.id==='builtin:demo-en')){
      deckMetas.unshift(demoDeckMeta());
      saveDecks();
    }
    rerender();
  },
  'export':()=>{
    const blob=new Blob([JSON.stringify({app:'kartochki',version:1,exported:nowIso(),progress},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='kartochki-progress.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },
  'import':()=>{ document.getElementById('import-input').click(); },
  'reset-progress':()=>{
    if(!confirm(t('confirmReset'))) return;
    progress={}; saveProgress(); toast(t('progressCleared')); rerender();
  },
  'flip-card':()=>{ if(!S||S.done)return; const ex=cur(); if(ex.card.type!=='card')return; S.flipped=!S.flipped; S.flipAnim=S.flipped?'fwd':'bwd'; playFaceAudio(ex, currentFaceSide(ex)); rerender(); },
  'reveal':()=>actReveal(),
  'hint':()=>actHint(),
  'flip-dir':()=>{ if(S&&!S.done) flipDir(); },
  'grade':arg=>{ if(!S||S.done)return; const ex=cur(); const can=ex.card.type==='card'?S.flipped:S.revealed; if(!can)return; grade(arg==='ok'); },
  'play':arg=>{
    if(!S||S.done)return;
    const ex=cur();
    const [side, idx]=String(arg).split(':');
    const list=audioListFor(ex, side==='2'?'2':'1');
    const i=parseInt(idx,10)||0;
    if(list[i]) playAudioUrl(list[i], ex.deck.metaId);
  },
  'exit':()=>{ S=null; pendingSetup=null; stopSpeech(); if(location.hash==='#/session'||location.hash==='#/') rerender(); else location.hash='#/'; rerender(); },
  'repeat-mistakes':()=>{
    const cfg=Object.assign({}, S.config, {onlyMistakes:true});
    const hadMistakes=S.bad>0;
    S=null;
    if(hadMistakes){ startSession(cfg); if(!S){ location.hash='#/'; rerender(); } }
    else { toast(t('noMistakes')); location.hash='#/'; rerender(); }
  },
  'goto':arg=>{
    const el=document.getElementById('sec-'+arg);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  },
  'copy':(arg,el)=>{
    const box=el.closest('.codebox');
    const pre=box?box.querySelector('pre'):null;
    if(pre) copyText(pre.textContent);
  }
};
let pendingReupload=null;
async function addUrl(url){
  const existing=deckMetas.find(d=>d.id==='url:'+url);
  if(existing){ fetchDeckText(existing.id, false); return; }
  toast('…');
  try{
    const res=await fetch(url, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const meta=addDeckFromText(text, url, 'url', url);
    if(meta){ toast(t('added')); rerender(); }
  }catch(e){
    toast(t('fetchFail')+': '+e.message);
  }
}

/* ============================ router & boot ============================ */
let rerenderQueued=false;
function rerender(){
  if(rerenderQueued) return;
  rerenderQueued=true;
  requestAnimationFrame(()=>{
    rerenderQueued=false;
    renderApp();
  });
}
function renderApp(){
  const app=document.getElementById('app');
  const h=location.hash||'#/';
  let html;
  if(h.indexOf('#/session')===0 && S) html=sessionView();
  else if(h.indexOf('#/instruction')===0) html=instructionView();
  else html=homeView();
  if(pendingSetup) html+=setupModalHtml();
  app.innerHTML=html;
  bindDynamic();
}
function bindDynamic(){
  const inp=document.getElementById('typed');
  if(inp){
    S.typed=inp.value;
    inp.addEventListener('input',()=>{ S.typed=inp.value; });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); actReveal(); } });
    inp.focus();
    const L=inp.value.length;
    try{ inp.setSelectionRange(L,L); }catch(e){}
  }
  const fs=document.getElementById('fontScale');
  if(fs) fs.addEventListener('change',()=>{ settings.fontScale=parseFloat(fs.value)||1; saveSettings(); applyFontScale(); });
  const vol=document.getElementById('vol');
  if(vol){
    vol.addEventListener('input',()=>{ settings.volume=parseFloat(vol.value)||0; if(settings.volume>0) settings.muted=false; });
    vol.addEventListener('change',()=>{ saveSettings(); });
  }
  const fi=document.getElementById('file-input');
  if(fi) fi.addEventListener('change',e=>{ if(e.target.files.length) onFilesChosen(e.target.files); e.target.value=''; });
  const fo=document.getElementById('folder-input');
  if(fo) fo.addEventListener('change',e=>{ if(e.target.files.length) onFilesChosen(e.target.files); e.target.value=''; });
  const zi=document.getElementById('zip-input');
  if(zi) zi.addEventListener('change',e=>{ if(e.target.files.length) onFilesChosen(e.target.files); e.target.value=''; });
  const fb=document.getElementById('folder-btn');
  if(fb && !('webkitdirectory' in document.createElement('input'))) fb.classList.add('hidden');
  const ii=document.getElementById('import-input');
  if(ii) ii.addEventListener('change',async e=>{
    const f=e.target.files[0]; e.target.value='';
    if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      if(!data || typeof data.progress!=='object') throw new Error('bad');
      let n=0;
      for(const k of Object.keys(data.progress)){
        const v=data.progress[k];
        if(v && typeof v==='object'){ progress[k]={k:v.k||0,m:v.m||0,h:v.h||0,ls:v.ls||''}; n++; }
      }
      saveProgress();
      toast(t('imported')+' ('+n+')');
      rerender();
    }catch(err){ toast(t('invalidFile')); }
  });
  const ui=document.getElementById('url-input');
  if(ui) ui.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); act['add-url'](); } });
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=act[el.dataset.act];
  if(fn) fn(el.dataset.arg, el, e);
});
// тихая пометка вместо консольных 404: картинка, которой нет в библиотеке, заменяется подписью
document.addEventListener('error', e=>{
  const el=e.target;
  if(el && el.tagName==='IMG'){
    const note=document.createElement('span');
    note.className='muted';
    note.style.fontSize='.8rem';
    note.textContent='🖼 '+t('mediaMissing')+(el.getAttribute('alt')?': '+el.getAttribute('alt'):'');
    el.replaceWith(note);
  }
}, true);
document.addEventListener('keydown', e=>{
  if(!(location.hash||'').startsWith('#/session') || !S || S.done) return;
  if(pendingSetup) return;
  const tag=(e.target.tagName||'').toUpperCase();
  const inInput=(tag==='INPUT'||tag==='TEXTAREA');
  if(e.code==='Escape'){ act['exit'](); return; }
  if(inInput){
    if(e.code==='Enter'){ e.preventDefault(); actReveal(); }
    return;
  }
  const ex=cur();
  switch(e.code){
    case 'Space':
    case 'Enter':
      e.preventDefault();
      if(ex.card.type==='card') act['flip-card'](); else actReveal();
      break;
    case 'Digit1': case 'Numpad1': act['grade']('ok'); break;
    case 'Digit2': case 'Numpad2': act['grade']('bad'); break;
    case 'KeyH': actHint(); break;
    case 'KeyP': playFaceAudio(cur(), currentFaceSide(cur())); break;
    case 'KeyF': flipDir(); break;
  }
});
window.addEventListener('hashchange', ()=>{ if(location.hash!=='#/session'){ S=null; stopSpeech(); } renderApp(); });
function applyFontScale(){
  document.documentElement.style.fontSize=Math.round(16*(settings.fontScale||1)*100)/100+'px';
}
function boot(){
  applyFontScale();
  seedBuiltins();
  initVoices(); // голоса синтеза загружаются заранее — иначе первый speak идёт системным голосом
  renderApp();
}
window.LT={ parseDeck, deckMetas:()=>deckMetas, progress:()=>progress, addDeckFromText, startSession, session:()=>S,
            onFilesChosen, mediaLib:()=>mediaLib, localAssets:()=>localAssets, resolverFor, audioCandidates,
            matchResultFor, matchedAudioFor, parseAudioStem, normJoin, textPrefixMatch, matchTextFor };
boot();
